<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top 100 Rated — GamePassDB</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f5f5}header,main{max-width:1100px;margin:auto;padding:22px 24px}a,button{color:inherit;background:#191c22;border:1px solid #333943;border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.list{display:grid;gap:10px;margin-top:20px}.row{display:grid;grid-template-columns:48px 80px 1fr auto;align-items:center;gap:14px;padding:10px;background:#191c22;border:1px solid #292e38;border-radius:12px;cursor:pointer}.row:hover{background:#242832}.cover{width:80px;height:112px;object-fit:cover;border-radius:7px;background:#292e38}.name{font-size:17px}.score{text-align:right;color:#c7ccd4}.muted{color:#9da3ad;font-size:13px}.error{padding:18px;border:1px solid #593333;background:#211718;border-radius:12px}@media(max-width:600px){.row{grid-template-columns:35px 58px 1fr}.cover{width:58px;height:82px}.score{font-size:12px}.name{font-size:14px}}</style></head><body><header><div class="top"><a href="./index.html">← Home</a><h1>Top 100 Rated Games</h1></div><p class="muted">All-time ranking based on ratings submitted to GamePassDB.</p></header><main><div id="list" class="list"><p class="muted">Loading ratings…</p></div></main><script>const SUPABASE_URL='https://lbuzooszxkygrvyvhpzm.supabase.co',SUPABASE_KEY='sb_publishable_kWJWGldsvTjjxKwZaBcq9A_FkZ4M_H9';let games=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const showError=m=>$("list").innerHTML='<div class="error">'+esc(m)+'</div>';async function load(){try{const r=await fetch('./games.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Game catalog could not be loaded ('+r.status+').');const d=await r.json();games=Array.isArray(d)?d:(d.games||d.active||[]);if(!games.length)throw Error('The game catalog is empty right now.');if(!window.supabase)throw Error('Supabase library did not load.');const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const{data,error}=await client.from('ratings').select('game_id,rating');if(error)throw error;const m=new Map();(data||[]).forEach(r=>{const id=String(r.game_id),x=m.get(id)||{sum:0,count:0};x.sum+=Number(r.rating);x.count++;m.set(id,x)});const rows=[...m.entries()].map(([id,x])=>({id,avg:x.sum/x.count,count:x.count,gamesId:games.find(g=>String(g.id||g.title)===id)})).filter(x=>x.gamesId).sort((a,b)=>b.avg-a.avg||b.count-a.count||String(a.gamesId.title).localeCompare(String(b.gamesId.title))).slice(0,100);if(!rows.length){$("list").innerHTML='<p class="muted">No ratings yet. Rate some games first and they will appear here.</p>';return}$("list").innerHTML=rows.map((r,i)=>{const g=r.gamesId;return'<div class="row" data-id="'+esc(g.id||g.title)+'"><b>#'+(i+1)+'</b><img class="cover" src="'+esc(g.cover||'')+'" onerror="this.style.visibility=\'hidden\'"><span class="name">'+esc(g.title)+'</span><span class="score">⭐ '+r.avg.toFixed(1)+'/10<br>'+r.count+' rating'+(r.count===1?'':'s')+'</span></div>'}).join('');document.querySelectorAll('.row').forEach(x=>x.onclick=()=>location.href='./index.html?game='+encodeURIComponent(x.dataset.id))}catch(e){console.error('Top 100 error:',e);showError('Could not load the Top 100 ratings. '+(e.message||'Please try again.'))}}const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=load;s.onerror=()=>showError('Could not load the ratings library.');document.head.appendChild(s);</script></body></html>
