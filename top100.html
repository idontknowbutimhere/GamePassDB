<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top 100 All Time — GamePassDB</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f5f5}header,main{max-width:1050px;margin:auto;padding:22px 24px}a,button{color:inherit;background:#191c22;border:1px solid #333943;border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.list{display:grid;gap:10px;margin-top:20px}.row{display:grid;grid-template-columns:42px 72px 1fr auto;align-items:center;gap:14px;padding:10px;background:#191c22;border:1px solid #292e38;border-radius:12px;cursor:pointer}.row:hover{background:#242832}.cover{width:72px;height:100px;object-fit:cover;border-radius:7px;background:#292e38}.name{font-size:17px}.score{text-align:right;color:#c7ccd4}.muted{color:#9da3ad;font-size:13px}.error{padding:18px;border:1px solid #593333;background:#211718;border-radius:12px}@media(max-width:600px){.row{grid-template-columns:30px 55px 1fr}.cover{width:55px;height:78px}.score{font-size:12px}.name{font-size:14px}}</style></head><body><header><div class="top"><a href="./index.html">← GamePassDB</a><h1>Top 100 All Time</h1></div><p class="muted">Highest-rated Game Pass games, calculated from all submitted ratings.</p></header><main><div id="list" class="list"><p class="muted">Loading ratings…</p></div></main><script>const U='https://lbuzooszxkygrvyvhpzm.supabase.co',K='sb_publishable_kWJWGldsvTjjxKwZaBcq9A_FkZ4M_H9';const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const cover=v=>v?(v.startsWith('//')?'https:'+v:v):'';async function run(){try{const gr=await fetch('./games.json?v='+Date.now(),{cache:'no-store'});if(!gr.ok)throw Error('Game catalog HTTP '+gr.status);const d=await gr.json(),games=Array.isArray(d)?d:(d.games||[]);if(!games.length)throw Error('Game catalog is empty.');const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';await new Promise((ok,no)=>{s.onload=ok;s.onerror=no;document.head.appendChild(s)});const sb=window.supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {data,error}=await sb.from('ratings').select('game_id,rating');if(error)throw error;const map=new Map();(data||[]).forEach(r=>{const id=String(r.game_id),g=games.find(x=>String(x.id||x.title)===id);if(!g)return;const x=map.get(id)||{g,sum:0,count:0};x.sum+=Number(r.rating);x.count++;map.set(id,x)});const rows=[...map.values()].map(x=>({...x,avg:x.sum/x.count})).sort((a,b)=>b.avg-a.avg||b.count-a.count||String(a.g.title).localeCompare(String(b.g.title))).slice(0,100);const el=document.getElementById('list');if(!rows.length){el.innerHTML='<p class="muted">No ratings yet. Rate some games first.</p>';return}el.innerHTML=rows.map((x,i)=>'<div class="row" data-id="'+esc(x.g.id||x.g.title)+'"><b>#'+(i+1)+'</b><img class="cover" src="'+esc(cover(x.g.cover))+'" alt=""><span class="name">'+esc(x.g.title)+'</span><span class="score">⭐ '+x.avg.toFixed(1)+'/10<br>'+x.count+' rating'+(x.count===1?'':'s')+'</span></div>').join('');document.querySelectorAll('.row').forEach(r=>r.onclick=()=>location.href='./index.html?game='+encodeURIComponent(r.dataset.id))}catch(e){console.error(e);document.getElementById('list').innerHTML='<div class="error">Could not load Top 100: '+esc(e.message||'unknown error')+'</div>'}}run();</script></body></html>
