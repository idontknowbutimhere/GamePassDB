name: Update XboxDB catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Xbox catalog
        run: node scripts/update-xbox-catalog.js
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xbox-games.json
          git diff --cached --quiet && exit 0
          git commit -m "Update XboxDB catalog"
          git push