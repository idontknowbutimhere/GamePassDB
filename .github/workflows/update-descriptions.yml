name: Update Steam Descriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write

jobs:
  descriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch missing descriptions
        run: node steam/update-descriptions.js

      - name: Commit updated descriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steam/games.json
          if git diff --cached --quiet; then
            echo "No description updates to commit."
          else
            git commit -m "Update Steam game descriptions"
            git push
          fi
