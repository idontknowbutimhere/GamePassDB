name: Update XboxDB Catalog
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-xbox.js'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Xbox catalog
        run: node scripts/update-xbox.js
      - name: Validate catalog
        run: node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('xbox/games.json'));if(!Array.isArray(d)||d.length<1000)throw new Error('Invalid Xbox catalog');console.log('Validated',d.length,'games')"
      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add xbox/games.json
          git diff --cached --quiet || git commit -m 'Update XboxDB catalog'
          git push