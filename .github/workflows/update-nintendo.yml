name: Update NintendoDB Catalog

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nintendo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update Nintendo catalog
        run: node scripts/update-nintendo.js

      - name: Validate catalog
        run: node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('nintendo/games.json')); if(!Array.isArray(d.games)||d.games.length<1000) throw new Error('Invalid Nintendo catalog'); console.log('Validated',d.games.length,'games');"

      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nintendo/games.json
          git diff --cached --quiet || git commit -m 'Update NintendoDB digital catalog'
          git push
