name: Update Game Pass catalog

on:
  workflow_dispatch:
  schedule:
    # Friday 00:00 UTC. We will adjust this once the catalog update timezone is confirmed.
    - cron: '0 0 * * 5'

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Read Xbox Game Pass catalog
        run: node scripts/update-gamepass-catalog.js

      - name: Commit catalog changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games.json
          git diff --cached --quiet || git commit -m 'Update Game Pass catalog'
          git push
