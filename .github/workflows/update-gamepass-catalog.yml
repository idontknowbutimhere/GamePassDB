name: Update Game Pass catalog

on:
  workflow_dispatch:
  schedule:
    # Primary run: Friday 00:05 UTC.
    - cron: '5 0 * * 5'
    # Safety retry: Friday 01:00 UTC if the primary run was delayed or failed.
    - cron: '0 1 * * 5'

permissions:
  contents: write

concurrency:
  group: gamepass-catalog-update
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Read Xbox Game Pass catalog
        run: node scripts/update-gamepass-catalog.js

      - name: Validate generated catalog
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('games.json','utf8')); if(!Array.isArray(d.games)||d.games.length<100) { throw new Error('Refusing to publish an empty/incomplete catalog: '+(d.games?.length||0)+' games'); } console.log('Validated '+d.games.length+' games.');"

      - name: Commit catalog changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games.json
          git diff --cached --quiet || git commit -m 'Update Game Pass catalog'
          git push
