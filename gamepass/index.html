<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GamePassDB — browse, search and rate Xbox Game Pass games."><title>GamePassDB</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f5f5}header,main{max-width:1400px;margin:auto;padding:20px 24px}h1{margin:0 0 14px}.nav,.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,button{border:1px solid #333943;border-radius:10px;padding:10px 13px;background:#191c22;color:inherit;font:inherit}input{flex:1 1 250px}button{cursor:pointer}button:hover{background:#242832}.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 270px;gap:20px}.side{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:14px}.layout>section{grid-column:2;grid-row:1}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.card{background:#191c22;border:1px solid #292e38;border-radius:14px;overflow:hidden;cursor:pointer}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#292e38;display:block}.card-info{padding:11px}.card h2{font-size:15px;margin:0 0 5px}.muted{color:#9da3ad;font-size:13px}.badge{display:inline-block;margin:7px 5px 0 0;padding:4px 7px;border-radius:6px;background:#7a3030;font-size:11px}.indie{background:#315d3b}.panel{background:#191c22;border:1px solid #292e38;border-radius:14px;padding:14px}.panel h3{margin:0 0 10px}.rank{display:grid;grid-template-columns:25px 48px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #292e38;cursor:pointer}.rank:last-child{border-bottom:0}.rank img{width:48px;height:68px;object-fit:cover;border-radius:5px}.rank .rname{font-size:12px}.rank .rscore{font-size:11px;color:#aeb4be}.empty{color:#9da3ad;padding:40px;text-align:center}.site-stats{position:fixed;left:10px;bottom:8px;color:#fff;font:11px ui-monospace,monospace;opacity:.9;z-index:10}dialog{width:min(560px,calc(100% - 30px));border:1px solid #333943;border-radius:16px;background:#191c22;color:inherit;padding:0}dialog::backdrop{background:#000b}.details{padding:22px}.detail-cover{width:min(220px,100%);aspect-ratio:2/3;object-fit:cover;border-radius:10px;display:block;margin:8px auto 18px}.rating{display:flex;flex-wrap:wrap;gap:6px}.rating button{min-width:40px}.description{line-height:1.6;color:#d4d7dc}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:5px 8px;background:#252a33;border-radius:7px}.rating-message{min-height:20px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:flex;flex-direction:column;grid-column:1;grid-row:1}.layout>section{grid-column:1;grid-row:2}.ad{order:3}}@media(max-width:560px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header><h1>GamePassDB</h1><div class="nav"><a href="../index.html"><button>Home</button></a><button id="removed">Removed Games</button><a href="../top100.html"><button>Top 100 All Time</button></a></div><div class="controls"><input id="search" type="search" placeholder="Search games..."><select id="genre"><option value="">All genres</option><option value="__indie">Indie</option><option value="__nonindie">Non-indie</option></select><select id="platform"><option value="">All platforms</option><option>Xbox</option><option>PC</option><option>Cloud</option></select><select id="status"><option value="active">Current games</option><option value="leaving">Leaving soon</option><option value="removed">Removed games</option><option value="">All games</option></select><button id="surprise">🎲 Surprise Me</button><button id="clear">Clear Filters</button></div></header><main><div class="layout"><aside class="side"><div class="panel"><h3>📅 Top 10 This Week</h3><div id="week" class="muted">Loading…</div></div><div class="panel"><h3>🔥 Top 10 Today</h3><div id="day" class="muted">Loading…</div></div><div class="panel ad"><h3>Advertisement</h3><div class="muted">Ad space</div></div></aside><section><h2 id="title">Current Game Pass Games</h2><div id="games" class="games"></div><div id="empty" class="empty" hidden>No games found.</div></section></div></main><div id="stats" class="site-stats">v0.2.0 · Visitors: —</div><dialog id="game"><div class="details"><button id="close" style="float:right">✕</button><a href="../index.html"><button>← Home</button></a><img id="dc" class="detail-cover"><h2 id="dt"></h2><div id="dr" class="muted"></div><p id="dd" class="description"></p><div id="dg" class="chips"></div><p id="ds"></p><h3>Rate this game</h3><div id="rating" class="rating"></div><p id="msg" class="muted rating-message">Choose a rating from 0–10.</p></div></dialog><script>const SUPABASE_URL='https://lbuzooszxkygrvyvhpzm.supabase.co';const SUPABASE_KEY='sb_publishable_kWJWGldsvTjjxKwZaBcq9A_FkZ4M_H9';let games=[],current=null,sb=null,removed=false,ratingBusy=false;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),cover=v=>v?(v.startsWith('//')?'https:'+v:v):'';function indie(g){return g.indie===true||String(g.indie).toLowerCase()==='true'||(g.genres||[]).some(x=>String(x).toLowerCase()==='indie')}function vid(){let m=document.cookie.match(/(?:^|; )gdb_voter=([^;]+)/),id=m?.[1];if(!id){id=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36)+Date.now();document.cookie='gdb_voter='+encodeURIComponent(id)+'; Max-Age=31536000; Path=/; SameSite=Lax'}return decodeURIComponent(id)}async function client(){if(sb)return sb;if(!window.supabase){await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=()=>no(new Error('Could not load the ratings library.'));document.head.append(s)})}if(!window.supabase)throw new Error('Ratings library unavailable.');sb=window.supabase.createClient(SUPABASE_URL.trim(),SUPABASE_KEY.trim(),{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});return sb}async function ratings(){let c=await client(),r=await c.from('ratings').select('game_id,rating,created_at');if(r.error)throw r.error;return r.data||[]}async function leaders(){try{let rs=await ratings(),now=Date.now(),make=min=>{let m=new Map;rs.filter(r=>!min||new Date(r.created_at).getTime()>=min).forEach(r=>{let id=String(r.game_id),g=games.find(x=>String(x.id||x.title)===id);if(!g)return;let x=m.get(id)||{g,sum:0,n:0};x.sum+=Number(r.rating);x.n++;m.set(id,x)});return [...m.values()].map(x=>({...x,a:x.sum/x.n})).sort((a,b)=>b.a-a.a||b.n-a.n).slice(0,10)};let html=a=>a.length?a.map((x,i)=>'<div class="rank" data-id="'+esc(x.g.id||x.g.title)+'"><b>#'+(i+1)+'</b><img src="'+esc(cover(x.g.cover))+'"><div><div class="rname">'+esc(x.g.title)+'</div><div class="rscore">⭐ '+x.a.toFixed(1)+' · '+x.n+'</div></div></div>').join(''):'<span class="muted">No ratings yet.</span>';$('week').innerHTML=html(make(now-604800000));$('day').innerHTML=html(make(now-86400000));document.querySelectorAll('.rank').forEach(x=>x.onclick=()=>open(x.dataset.id))}catch(e){console.error('Leaderboard load failed:',e);$('week').textContent='Ratings unavailable.';$('day').textContent='Ratings unavailable.'}}function filters(){let q=$('search').value.toLowerCase().trim(),ge=$('genre').value,pl=$('platform').value,st=$('status').value;return games.filter(g=>{let s=g.status||'active',okInd=ge==='__indie'?indie(g):ge==='__nonindie'?!indie(g):true,okGe=ge&&!['__indie','__nonindie'].includes(ge)?(g.genres||[]).includes(ge):true,okPl=!pl||(g.platforms||[]).some(p=>String(p).toLowerCase()===pl.toLowerCase()),okSt=removed?s==='removed':(!st||(st==='leaving'?!!g.leavingSoon:s===st));return(!q||String(g.title).toLowerCase().includes(q))&&okInd&&okGe&&okPl&&okSt})}function render(){let a=filters();$('title').textContent=removed?'Removed Games':'Current Game Pass Games';$('games').innerHTML=a.map(g=>'<article class="card" data-id="'+esc(g.id||g.title)+'"><img class="cover" src="'+esc(cover(g.cover))+'" alt=""><div class="card-info"><h2>'+esc(g.title)+'</h2><div class="muted">'+esc((g.genres||[]).join(' · '))+'</div>'+(indie(g)?'<span class="badge indie">Indie</span>':'')+(g.leavingSoon?'<span class="badge">Leaving soon</span>':'')+(g.status==='removed'?'<span class="badge">Removed</span>':'')+'</div></article>').join('');$('empty').hidden=!!a.length;document.querySelectorAll('.card').forEach(x=>x.onclick=()=>open(x.dataset.id))}async function open(id){current=games.find(g=>String(g.id||g.title)===String(id));if(!current)return;$('dt').textContent=current.title;$('dc').src=cover(current.cover);$('dd').textContent=current.description||'No description available yet.';$('dg').innerHTML=(current.genres||[]).map(g=>'<span class="chip">'+esc(g)+'</span>').join('');$('ds').textContent=current.status==='removed'?'Removed from Game Pass':current.leavingSoon?'🕐 Leaving soon':'Available on Game Pass';let r=$('rating');r.innerHTML=Array.from({length:11},(_,i)=>'<button data-r="'+i+'">'+i+'</button>').join('');r.querySelectorAll('button').forEach(b=>b.onclick=()=>rate(+b.dataset.r));$('msg').textContent='Choose a rating from 0–10.';$('game').showModal();try{let rs=(await ratings()).filter(r=>String(r.game_id)===String(current.id||current.title)),n=rs.length;$('dr').textContent=n?'⭐ '+(rs.reduce((a,r)=>a+Number(r.rating),0)/n).toFixed(1)+'/10 · '+n+' ratings':'⭐ Not rated yet'}catch(e){$('dr').textContent='Ratings unavailable.'}}async function rate(v){if(ratingBusy||!current)return;ratingBusy=true;$('msg').textContent='Submitting…';try{if(!Number.isInteger(v)||v<0||v>10)throw new Error('Rating must be between 0 and 10.');let c=await client(),gid=String(current.id||current.title),voter=vid();let existing=await c.from('ratings').select('id').eq('game_id',gid).eq('voter_id',voter).limit(1);if(existing.error)throw existing.error;let r;if(existing.data&&existing.data.length){r=await c.from('ratings').update({rating:v}).eq('id',existing.data[0].id).eq('voter_id',voter)}else{r=await c.from('ratings').insert({game_id:gid,rating:v,voter_id:voter})}if(r.error)throw r.error;$('msg').textContent='✓ Rated '+v+'/10';let rs=await ratings(),mine=rs.filter(x=>String(x.game_id)===gid),n=mine.length;$('dr').textContent=n?'⭐ '+(mine.reduce((a,x)=>a+Number(x.rating),0)/n).toFixed(1)+'/10 · '+n+' ratings':'⭐ Not rated yet';leaders()}catch(e){console.error('Rating submission failed:',e);$('msg').textContent='Could not submit rating: '+(e?.message||'Unknown error')}finally{ratingBusy=false}}function reset(){removed=false;$('search').value='';$('genre').value='';$('platform').value='';$('status').value='active';render()}async function load(){try{let r=await fetch('../games.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();games=Array.isArray(d)?d:(d.games||d.active||[]);let gs=[...new Set(games.flatMap(g=>g.genres||[]))].filter(x=>String(x).toLowerCase()!=='indie').sort();$('genre').innerHTML='<option value="">All genres</option><option value="__indie">Indie</option><option value="__nonindie">Non-indie</option>'+gs.map(x=>'<option>'+esc(x)+'</option>').join('');render();leaders();try{let c=await client(),v=await c.rpc('increment_site_visitors');if(!v.error)$('stats').textContent='v0.2.0 · Visitors: '+Number(v.data).toLocaleString()}catch(e){console.warn('Visitor counter unavailable:',e)}}catch(e){console.error('Catalog load failed:',e);$('empty').hidden=false;$('empty').textContent='Could not load the GamePassDB catalog.'}}$('search').oninput=render;$('genre').onchange=render;$('platform').onchange=render;$('status').onchange=render;$('clear').onclick=reset;$('removed').onclick=()=>{removed=true;$('status').value='removed';render()};$('close').onclick=()=>$('game').close();$('surprise').onclick=()=>{let a=filters();if(a.length)open(a[Math.floor(Math.random()*a.length)].id)};load();</script><script src="../theme.js"></script></body></html>
