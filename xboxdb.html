<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XboxDB</title><style>*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#f5f5f5;font-family:system-ui,sans-serif}header{max-width:1500px;margin:auto;padding:22px 24px}h1{margin:0 0 14px}.nav,.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button,select,input,.btn{background:#191c22;color:#fff;border:1px solid #333943;border-radius:10px;padding:10px 13px;font:inherit}button,.btn{cursor:pointer;text-decoration:none}.filters input{flex:1 1 250px}main{max-width:1500px;margin:auto;padding:10px 24px 50px}.three-col{display:grid;grid-template-columns:250px minmax(0,900px) 250px;justify-content:center;gap:24px;align-items:start}.left,.right{display:grid;gap:16px}.panel{background:#191c22;border:1px solid #292e38;border-radius:14px;padding:14px}.panel h3{margin:0 0 12px;font-size:16px}.rank{display:grid;grid-template-columns:22px 42px minmax(0,1fr);gap:8px;align-items:center;padding:8px 4px;border-radius:8px;cursor:pointer}.rank:hover{background:#242832}.rank img{width:42px;height:59px;object-fit:cover;border-radius:5px}.rank-name{font-size:12px;line-height:1.25}.score{color:#bfc5ce;font-size:11px}.adbox{height:160px;border:1px dashed #414753;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#737b88;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.games{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#191c22;border:1px solid #292e38;border-radius:14px;overflow:hidden;cursor:pointer}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#292e38}.info{padding:11px}.info h2{font-size:15px;margin:0 0 5px}.muted{color:#9da3ad;font-size:12px}.price{font-size:14px;font-weight:700;margin-top:6px}.badge{display:inline-block;margin:5px 4px 0 0;padding:4px 7px;border-radius:6px;background:#344d70;font-size:11px}.indie{background:#315d3b}.empty{text-align:center;color:#9da3ad;padding:40px}.version{position:fixed;left:10px;bottom:7px;color:#fff;font:11px monospace;opacity:.9}@media(max-width:1200px){.three-col{grid-template-columns:210px minmax(0,1fr) 210px}.games{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:900px){.three-col{grid-template-columns:1fr}.left{grid-template-columns:1fr 1fr}.games{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:600px){.left{grid-template-columns:1fr}.games{grid-template-columns:repeat(2,minmax(0,1fr))}}dialog{background:#191c22;color:#fff;border:1px solid #333943;border-radius:16px;max-width:560px;width:calc(100% - 30px)}dialog::backdrop{background:#000b}.details{padding:22px}.detail-cover{width:210px;max-width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;display:block;margin:10px auto 18px}.rating{display:flex;flex-wrap:wrap;gap:6px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#252a33;padding:5px 8px;border-radius:7px}.desc{line-height:1.6;color:#d4d7dc}</style></head><body><header><h1>XboxDB</h1><nav class="nav"><a class="btn" href="./index.html">Home</a><a class="btn" href="./gamepass.html">GamePassDB</a><button id="clearTop">Clear filters</button></nav><div class="filters"><input id="search" placeholder="Search Xbox games..."><select id="genre"><option value="">All genres</option></select><select id="platform"><option value="">All platforms</option><option>Xbox Series X|S</option><option>Xbox One</option><option>PC</option></select><select id="price"><option value="">Any price</option><option value="free">Free</option><option value="paid">Paid</option></select><button id="surprise">🎲 Surprise Me</button></div></header><main><div class="three-col"><aside class="left"><section class="panel"><h3>⭐ Top 10 Today</h3><div id="today" class="muted">Loading…</div></section><section class="panel"><h3>🔥 Top 10 This Week</h3><div id="week" class="muted">Loading…</div></section></aside><section class="catalog"><h2>Xbox Games</h2><div id="games" class="games"></div><div id="empty" class="empty" hidden>No games found.</div></section><aside class="right"><section class="panel"><h3>Advertisement</h3><div class="adbox">Ad space</div></section></aside></div></main><div class="version">XboxDB · Visitors: —</div><dialog id="game"><div class="details"><button id="closeGame" style="float:right">✕</button><a class="btn" href="./index.html">← Home</a><img id="dc" class="detail-cover"><h2 id="dt"></h2><div id="dr" class="muted"></div><div id="dp" class="price"></div><div id="db" class="chips"></div><p id="dd" class="desc"></p><div id="dg" class="chips"></div><p><a id="store" class="btn" target="_blank" rel="noopener">Open Xbox Store</a></p><h3>Rate this game</h3><div id="rating" class="rating"></div><p id="rm" class="muted">Choose 0–10.</p></div></dialog><script>const SUPABASE_URL='https://lbuzooszxkygrvyvhpzm.supabase.co',SUPABASE_KEY='sb_publishable_kWJWGldsvTjjxKwZaBcq9A_FkZ4M_H9';let games=[],cur=null,client;const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const vals=(g,k)=>{let v=g?.[k];if(Array.isArray(v))return v.map(x=>String(x).trim()).filter(Boolean);if(v==null)return[];return String(v).split(/[,|]/).map(x=>x.trim()).filter(Boolean)};const indie=g=>g.indie===true||String(g.indie).toLowerCase()==='true'||vals(g,'genres').some(x=>x.toLowerCase()==='indie');function badges(g){return vals(g,'platforms').map(x=>'<span class="badge">'+esc(x)+'</span>').join('')+(indie(g)?'<span class="badge indie">Indie</span>':'')}function matches(g){const q=$('search').value.trim().toLowerCase(),ge=$('genre').value.toLowerCase(),p=$('platform').value.toLowerCase(),pr=$('price').value;const title=String(g.title||'').toLowerCase(),genres=vals(g,'genres').map(x=>x.toLowerCase()),platforms=vals(g,'platforms').map(x=>x.toLowerCase()),price=String(g.price||'').toLowerCase();return(!q||title.includes(q))&&(!ge||genres.includes(ge)||(ge==='indie'&&indie(g)))&&(!p||platforms.some(x=>x.includes(p)))&&(!pr||(pr==='free'&&(/free|0[.,]00|0\$/.test(price)))||(pr==='paid'&&price&&!/free|0[.,]00|0\$/.test(price)))}function render(){const list=games.filter(matches);$('games').innerHTML=list.map(g=>'<article class="card" data-id="'+esc(g.id||g.title)+'"><img class="cover" loading="lazy" src="'+esc(g.cover||'')+'"><div class="info"><h2>'+esc(g.title)+'</h2><div class="price">'+esc(g.price||'Price unavailable')+'</div><div class="muted">'+esc(vals(g,'genres').join(' · '))+'</div>'+badges(g)+'</div></article>').join('');$('empty').hidden=list.length>0;document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openGame(x.dataset.id))}async function sb(){if(client)return client;if(!window.supabase)await new Promise((res,rej)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=res;s.onerror=rej;document.head.appendChild(s)});client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});return client}async function rankings(){try{let{data,error}=await(await sb()).from('ratings').select('game_id,rating,created_at');if(error)throw error;let now=Date.now(),day=new Date();day.setHours(0,0,0,0);function make(since){let m={};(data||[]).filter(r=>String(r.game_id).startsWith('xbox:')&&new Date(r.created_at).getTime()>=since).forEach(r=>{let k=String(r.game_id);m[k]??={sum:0,count:0};m[k].sum+=Number(r.rating);m[k].count++});return Object.entries(m).map(([id,x])=>({id:id.slice(5),avg:x.sum/x.count,count:x.count})).sort((a,b)=>b.avg-a.avg||b.count-a.count).slice(0,10)}function draw(id,rows){$(id).innerHTML=rows.map((r,i)=>{let g=games.find(x=>String(x.id)===String(r.id));return g?'<div class="rank" data-id="'+esc(g.id)+'"><b>#'+(i+1)+'</b><img src="'+esc(g.cover||'')+'"><span class="rank-name">'+esc(g.title)+'<br><span class="score">⭐ '+r.avg.toFixed(1)+' · '+r.count+' vote'+(r.count===1?'':'s')+'</span></span></div>':''}).join('')||'<span class="muted">No ratings yet.</span>';$(id).querySelectorAll('.rank').forEach(x=>x.onclick=()=>openGame(x.dataset.id))}draw('today',make(day.getTime()));draw('week',make(now-604800000))}catch(e){$('today').textContent=$('week').textContent='Ratings unavailable.'}}async function refreshRating(g){try{let{data,error}=await(await sb()).from('ratings').select('rating').eq('game_id','xbox:'+String(g.id));if(error)throw error;let n=data?.length||0,avg=n?data.reduce((a,r)=>a+Number(r.rating),0)/n:0;$('dr').textContent=n?'⭐ '+avg.toFixed(1)+'/10 · '+n+' ratings':'⭐ Not rated yet'}catch(e){$('dr').textContent='⭐ Rating unavailable'}}async function openGame(id){cur=games.find(g=>String(g.id)===String(id));if(!cur)return;$('dc').src=cur.cover||'';$('dt').textContent=cur.title;$('dp').textContent=cur.price||'Price unavailable';$('dd').textContent=cur.description||'No description available yet.';$('db').innerHTML=badges(cur);$('dg').innerHTML=vals(cur,'genres').map(x=>'<span class="chip">'+esc(x)+'</span>').join('');$('store').href=cur.sourceUrl||'#';$('rating').innerHTML=Array.from({length:11},(_,i)=>'<button data-r="'+i+'">'+i+'</button>').join('');$('rating').querySelectorAll('button').forEach(b=>b.onclick=()=>rate(Number(b.dataset.r)));await refreshRating(cur);$('game').showModal()}async function rate(v){try{$('rm').textContent='Submitting…';let{error}=await(await sb()).from('ratings').insert({game_id:'xbox:'+String(cur.id),rating:v});if(error)throw error;$('rm').textContent='✓ Rated '+v+'/10';await refreshRating(cur);await rankings()}catch(e){$('rm').textContent='Could not submit rating: '+(e.message||'Supabase rejected the request')}}function surprise(){let p=games.filter(matches);if(!p.length)return alert('No games match these filters.');openGame(p[Math.floor(Math.random()*p.length)].id)}async function load(){try{let r=await fetch('./xbox-games.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('xbox-games.json returned '+r.status);let d=await r.json();games=d.games||[];let genres=[...new Set(games.flatMap(g=>vals(g,'genres')).filter(x=>x.toLowerCase()!=='indie'))].sort();$('genre').innerHTML='<option value="">All genres</option><option value="indie">Indie</option>'+genres.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');render();rankings()}catch(e){$('empty').hidden=false;$('empty').textContent='Could not load the Xbox catalog.';console.error(e)}}$('clearTop').onclick=()=>{$('search').value='';$('genre').value='';$('platform').value='';$('price').value='';render()};$('closeGame').onclick=()=>$('game').close();$('surprise').onclick=surprise;['search','genre','platform','price'].forEach(id=>{$(id).addEventListener('input',render);$(id).addEventListener('change',render)});load();</script></body></html>
