<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XboxDB Top 100</title><style>body{margin:0;background:#0f1115;color:#fff;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card{background:#191c22;border:1px solid #292e38;border-radius:12px;padding:12px;cursor:pointer}.muted{color:#9da3ad}a{color:inherit;text-decoration:none}button{padding:9px 12px;border-radius:9px;background:#191c22;color:#fff;border:1px solid #333943}</style></head><body><main><a href="./"><button>← XboxDB</button></a> <a href="../index.html"><button>Home</button></a><h1>🏆 XboxDB Top 100 All Time</h1><div id="list" class="grid">Loading…</div></main><script>const U='https://lbuzooszxkygrvyvhpzm.supabase.co',K='sb_publishable_kWJWGldsvTjjxKwZaBcq9A_FkZ4M_H9';let games=[];const $=x=>document.getElementById(x),gid=g=>String(g.id??g.uuid??g.href??g.title);async function run(){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';document.head.append(s);await new Promise((r,n)=>{s.onload=r;s.onerror=n});const sb=window.supabase.createClient(U,K,{auth:{persistSession:false}}),r=await sb.from('ratings').select('game_id,rating');if(r.error)throw r.error;const data=await(await fetch('./games.json?v='+Date.now())).json();games=Array.isArray(data)?data:data.games||[];const m=new Map;for(const x of r.data||[]){if(!String(x.game_id).startsWith('xbox:'))continue;const id=String(x.game_id).slice(5),g=games.find(z=>gid(z)===id);if(!g)continue;const v=m.get(id)||{g,sum:0,n:0};v.sum+=Number(x.rating);v.n++;m.set(id,v)}const top=[...m.values()].map(x=>({...x,a:x.sum/x.n})).sort((a,b)=>b.a-a.a||b.n-a.n).slice(0,100);$('list').innerHTML=top.length?top.map((x,i)=>`<div class="card" onclick="location.href='./?game=${encodeURIComponent(gid(x.g))}'"><b>#${i+1}</b><h3>${String(x.g.title??x.g.name).replace(/[&<>]/g,'')}</h3><div class="muted">⭐ ${x.a.toFixed(1)}/10 · ${x.n} ratings</div></div>`).join(''):'<p class="muted">No Xbox ratings yet.</p>'}run().catch(e=>{$('list').textContent='Could not load Xbox rankings.';console.error(e)});</script></body></html>
