<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>PlayStationDB Top 100</title><style>body{margin:0;background:#0f1115;color:#f5f5f5;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}.nav{display:flex;gap:8px;margin-bottom:20px}button{background:#191c22;color:#fff;border:1px solid #333943;border-radius:10px;padding:10px 14px;cursor:pointer}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.rank{display:grid;grid-template-columns:40px 72px 1fr;gap:12px;align-items:center;background:#191c22;border:1px solid #292e38;border-radius:12px;padding:10px;cursor:pointer}.rank img{width:72px;height:100px;object-fit:cover;border-radius:7px}.score{color:#9da3ad;font-size:13px}.empty{color:#9da3ad;text-align:center;padding:60px}</style></head><body><main><div class='nav'><a href='./index.html'><button>← PlayStationDB</button></a><a href='../index.html'><button>Home</button></a></div><h1>🏆 Top 100 All Time</h1><p class='score'>Ranked by PlayStationDB community ratings.</p><div id='list' class='list'></div><div id='empty' class='empty'>Loading…</div></main><script>const U='https://lbuzooszxkygrvyvhpzm.supabase.co',K=atob('c2JfcHVibGlzaGFibGVfa1dKV0dsZHN2VGpqeEt3WmFCY3E5QV9Ga1o0TV9IOQ==');let games=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const gid=g=>String(g.id??g.uuid??g.href??g.title);async function main(){try{games=await (await fetch('./games.json?v='+Date.now())).json();if(!Array.isArray(games))games=games.games||[];if(!window.supabase)await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=no;document.head.appendChild(s)});let sb=window.supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}),r=await sb.from('ratings').select('game_id,rating'),m=new Map;for(const x of r.data||[]){if(!String(x.game_id).startsWith('ps:'))continue;let id=String(x.game_id).slice(3),g=games.find(z=>gid(z)===id);if(!g)continue;let v=m.get(id)||{g,sum:0,n:0};v.sum+=Number(x.rating);v.n++;m.set(id,v)}let a=[...m.values()].map(x=>({...x,a:x.sum/x.n})).sort((x,y)=>y.a-x.a||y.n-x.n||String(x.g.title??x.g.name).localeCompare(String(y.g.title??y.g.name))).slice(0,100);$('list').innerHTML=a.map((x,i)=>`<div class='rank' onclick="location.href='./index.html?game=${encodeURIComponent(gid(x.g))}'"><b>#${i+1}</b><img src='${esc(x.g.image??x.g.cover??'')}'><div><strong>${esc(x.g.title??x.g.name)}</strong><div class='score'>⭐ ${x.a.toFixed(1)}/10 · ${x.n} ratings</div></div></div>`).join('');$('empty').textContent=a.length?'':'No PlayStationDB ratings yet.'}catch(e){console.error(e);$('empty').textContent='Could not load Top 100.'}}main();</script><script src="../theme.js"></script></body></html>
