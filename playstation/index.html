<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='description' content='PlayStationDB — digital PlayStation Store games for PS4 and PS5.'><title>PlayStationDB</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f5f5}header,main{max-width:1400px;margin:auto;padding:20px 24px}h1{margin:0 0 14px}.nav,.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,button{border:1px solid #333943;border-radius:10px;padding:10px 13px;background:#191c22;color:inherit;font:inherit}input{flex:1 1 250px}button{cursor:pointer}button:hover{background:#242832}.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 270px;gap:20px}.side{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:14px}.layout>section{grid-column:2;grid-row:1}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.card{background:#191c22;border:1px solid #292e38;border-radius:14px;overflow:hidden;cursor:pointer}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#292e38;display:block}.card-info{padding:11px}.card h2{font-size:15px;margin:0 0 5px}.muted{color:#9da3ad;font-size:13px}.panel{background:#191c22;border:1px solid #292e38;border-radius:14px;padding:14px}.panel h3{margin:0 0 10px}.rank{display:grid;grid-template-columns:25px 48px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #292e38;cursor:pointer}.rank img{width:48px;height:68px;object-fit:cover;border-radius:5px}.rank .rname{font-size:12px}.rank .rscore{font-size:11px;color:#aeb4be}.empty{color:#9da3ad;padding:40px;text-align:center}.price{font-weight:700;margin-top:8px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:5px 8px;background:#252a33;border-radius:7px}.rating{display:flex;flex-wrap:wrap;gap:6px}.rating button{min-width:40px}.description{line-height:1.6;color:#d4d7dc}.rating-message{min-height:20px}dialog{width:min(620px,calc(100% - 30px));border:1px solid #333943;border-radius:16px;background:#191c22;color:inherit;padding:0}dialog::backdrop{background:#000b}.details{padding:22px}.detail-cover{width:min(220px,100%);aspect-ratio:2/3;object-fit:cover;border-radius:10px;display:block;margin:8px auto 18px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:flex;flex-direction:column;grid-column:1;grid-row:1}.layout>section{grid-column:1;grid-row:2}}@media(max-width:560px){.side{gap:10px}.games{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header><h1>PlayStationDB</h1><div class='nav'><a href='../index.html'><button>Home</button></a><a href='./top100.html'><button>Top 100 All Time</button></a><button id='clear'>Clear Filters</button><button id='surprise'>🎲 Surprise Me</button></div><div class='controls'><input id='search' type='search' placeholder='Search PlayStation Store games...'><select id='platform'><option value=''>All platforms</option></select><select id='genre'><option value=''>All genres</option></select><select id='price'><option value=''>All prices</option><option value='free'>Free</option><option value='under20'>Under $20</option><option value='20to40'>$20–$40</option><option value='over40'>Over $40</option></select></div></header><main><div class='layout'><aside class='side'><div class='panel'><h3>🔥 Top 10 Today</h3><div id='day' class='muted'>Loading…</div></div><div class='panel'><h3>📅 Top 10 This Week</h3><div id='week' class='muted'>Loading…</div></div><div class='panel'><h3>Advertisement</h3><div class='muted'>Ad space</div></div></aside><section><h2>PlayStation Store Games</h2><div id='games' class='games'></div><div id='empty' class='empty' hidden>No games found.</div><div class='controls'><button id='prev'>Previous</button><span id='page'>Page 1</span><button id='next'>Next</button></div></section></div></main><dialog id='game'><div class='details'><button id='close' style='float:right'>✕</button><a href='../index.html'><button>← Home</button></a><img id='dc' class='detail-cover'><h2 id='dt'></h2><div id='dr' class='muted'></div><p id='dd' class='description'></p><div id='dg' class='chips'></div><p id='ds'></p><p><a id='store' target='_blank' rel='noopener'>Open PlayStation Store</a></p><h3>Rate this game</h3><div id='rating' class='rating'></div><p id='msg' class='muted rating-message'>Choose a rating from 0–10.</p></div></dialog><script src='./app.js'></script><script src="../theme.js"></script></body></html>
