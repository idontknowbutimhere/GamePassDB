<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SteamDB — Top 100 All Time</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f5f5}header,main{max-width:1100px;margin:auto;padding:22px 24px}a,button{color:inherit;background:#191c22;border:1px solid #333943;border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.list{display:grid;gap:10px;margin-top:20px}.row{display:grid;grid-template-columns:42px 72px 1fr auto;align-items:center;gap:14px;padding:10px;background:#191c22;border:1px solid #292e38;border-radius:12px;cursor:pointer}.row:hover{background:#242832}.cover{width:72px;height:100px;object-fit:cover;border-radius:7px;background:#292e38}.name{font-size:17px}.score{text-align:right;color:#c7ccd4}.muted{color:#9da3ad;font-size:13px}.error{padding:18px;border:1px solid #593333;background:#211718;border-radius:12px}dialog{width:min(560px,calc(100% - 30px));border:1px solid #333943;border-radius:16px;background:#191c22;color:inherit;padding:0}dialog::backdrop{background:#000b}.details{padding:22px}.detail-cover{width:100%;border-radius:10px}.rating{display:flex;flex-wrap:wrap;gap:6px}.rating button{min-width:40px}.steam{display:inline-block;margin-top:10px}@media(max-width:600px){.row{grid-template-columns:30px 55px 1fr}.cover{width:55px;height:78px}.score{font-size:12px}.name{font-size:14px}}</style></head><body><header><div class="top"><a href="./index.html">← SteamDB</a><h1>Top 100 All Time</h1></div><p class="muted">Highest-rated Steam games by SteamDB users.</p></header><main><div id="list" class="list"><p class="muted">Loading…</p></div></main><dialog id="dialog"><div class="details"><button id="close" style="float:right">✕</button><img id="cover" class="detail-cover" alt=""><h2 id="name"></h2><div id="ratingText" class="muted"></div><div id="price" class="muted"></div><h3>Rate this game</h3><div id="buttons" class="rating"></div><p id="msg" class="muted">Choose a rating from 0–10.</p><a id="steam" class="steam" target="_blank" rel="noopener"><button>Open on Steam ↗</button></a></div></dialog><script>const U='https://lbuzooszxkygrvyvhpzm.supabase.co',K='sb_publishable_kWJWGldsvTjjxKwZaBcq9A_FkZ4M_H9';let games=[],ratingsData=[],sb=null,current=null,busy=false;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),norm=v=>String(v??'').trim().toLowerCase();function price(g){if(g.isFree===true||norm(g.price)==='free'||g.priceCents===0||g.priceCents==='0')return'Free';let c=Number(g.priceCents);if(Number.isFinite(c))return'$'+(c>1000?c/100:c).toFixed(2);let p=Number(String(g.price??'').replace(/[^0-9.-]/g,''));return Number.isFinite(p)?'$'+p.toFixed(2):'Price unavailable'}function img(id){return`https://cdn.akamai.steamstatic.com/steam/apps/${id}/library_600x900.jpg`}function head(id){return`https://cdn.akamai.steamstatic.com/steam/apps/${id}/header.jpg`}async function client(){if(sb)return sb;if(!window.supabase){await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=()=>no(Error('Ratings library unavailable'));document.head.append(s)})}sb=window.supabase.createClient(U.trim(),K.trim(),{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});return sb}async function getRatings(){let c=await client(),all=[],from=0;while(true){let r=await c.from('ratings').select('id,game_id,rating,voter_id,created_at').like('game_id','steam:%').range(from,from+999);if(r.error)throw r.error;let batch=r.data||[];all.push(...batch);if(batch.length<1000)break;from+=1000;if(from>=50000)break}return all}function voter(){let m=document.cookie.match(/(?:^|; )steamdb_voter=([^;]+)/),id=m?.[1];if(!id){id=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36)+Date.now();document.cookie='steamdb_voter='+encodeURIComponent(id)+'; Max-Age=31536000; Path=/; SameSite=Lax'}return decodeURIComponent(id)}function open(g){current=g;let rs=ratingsData.filter(r=>String(r.game_id)==='steam:'+String(g.id)),n=rs.length,avg=n?rs.reduce((a,r)=>a+Number(r.rating),0)/n:0;$('cover').src=img(g.id);$('cover').onerror=()=>{$('cover').src=head(g.id)};$('name').textContent=g.title;$('ratingText').textContent=n?'⭐ '+avg.toFixed(1)+'/10 · '+n+' ratings':'⭐ Not rated';$('price').textContent='💰 '+price(g);$('steam').href=`https://store.steampowered.com/app/${g.id}/`;$('buttons').innerHTML=Array.from({length:11},(_,i)=>`<button data-r="${i}">${i}</button>`).join('');$('buttons').querySelectorAll('button').forEach(b=>b.onclick=()=>rate(Number(b.dataset.r)));$('msg').textContent='Choose a rating from 0–10.';$('dialog').showModal()}async function rate(v){if(busy||!current)return;busy=true;$('msg').textContent='Submitting…';try{let c=await client(),gid='steam:'+String(current.id),id=voter(),e=await c.from('ratings').select('id').eq('game_id',gid).eq('voter_id',id).limit(1);if(e.error)throw e.error;let r=e.data?.length?await c.from('ratings').update({rating:v}).eq('id',e.data[0].id).eq('voter_id',id):await c.from('ratings').insert({game_id:gid,rating:v,voter_id:id});if(r.error)throw r.error;ratingsData=await getRatings();$('msg').textContent='✓ Rated '+v+'/10';open(current);render()}catch(e){$('msg').textContent='Could not submit rating: '+(e.message||'Unknown error')}finally{busy=false}}function render(){let gm=new Map(games.map(g=>[String(g.id),g])),m=new Map;for(const r of ratingsData){let id=String(r.game_id).replace(/^steam:/,''),g=gm.get(id);if(!g)continue;let x=m.get(id)||{g,sum:0,n:0};x.sum+=Number(r.rating);x.n++;m.set(id,x)}let top=[...m.values()].map(x=>({...x,a:x.sum/x.n})).filter(x=>x.n>0&&Number.isFinite(x.a)).sort((a,b)=>b.a-a.a||b.n-a.n||String(a.g.title).localeCompare(String(b.g.title))).slice(0,100);$('list').innerHTML=top.length?top.map((x,i)=>`<div class="row" data-i="${i}"><b>#${i+1}</b><img class="cover" src="${img(x.g.id)}" loading="lazy" onerror="this.onerror=null;this.src='${head(x.g.id)}'" alt=""><span class="name">${esc(x.g.title)}</span><span class="score">⭐ ${x.a.toFixed(1)}/10<br>${x.n} rating${x.n===1?'':'s'}</span></div>`).join(''):'<p class="muted">No Steam games have been rated yet.</p>';document.querySelectorAll('.row').forEach(r=>r.onclick=()=>open(top[Number(r.dataset.i)].g))}async function init(){try{let r=await fetch('./games.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Game catalog HTTP '+r.status);let d=await r.json();games=Array.isArray(d)?d:(d.games||d.data||d.results||[]);if(!games.length)throw Error('Steam catalog is empty.');ratingsData=await getRatings();render()}catch(e){console.error(e);$('list').innerHTML='<div class="error">Could not load SteamDB Top 100: '+esc(e.message||'unknown error')+'</div>'}}$('close').onclick=()=>$('dialog').close();init();</script></body></html>
