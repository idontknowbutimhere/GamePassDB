<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SteamDB — Top 100 All Time</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f5f5}header,main{max-width:1200px;margin:auto;padding:20px 24px}.nav{display:flex;gap:8px;margin-bottom:20px}button{border:1px solid #333943;border-radius:10px;padding:10px 13px;background:#191c22;color:inherit;font:inherit;cursor:pointer}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.card{background:#191c22;border:1px solid #292e38;border-radius:14px;overflow:hidden;cursor:pointer;position:relative}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#292e38;display:block}.info{padding:11px}.title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:#9da3ad;font-size:13px;margin-top:5px}.rank{position:absolute;top:8px;left:8px;background:#0b0d10dd;border:1px solid #ffffff22;border-radius:8px;padding:5px 8px;font-weight:800}.empty{text-align:center;color:#9da3ad;padding:50px}dialog{width:min(560px,calc(100% - 30px));border:1px solid #333943;border-radius:16px;background:#191c22;color:inherit;padding:0}dialog::backdrop{background:#000b}.details{padding:22px}.detail-cover{width:100%;border-radius:10px}.steam{display:inline-block;margin-top:10px;padding:9px 12px;border-radius:9px;background:#252a33;color:#fff;text-decoration:none}.rating{display:flex;flex-wrap:wrap;gap:6px}.rating button{min-width:40px}.rating-message{min-height:20px}</style></head><body><header><h1>🏆 Steam Top 100 All Time</h1><p class="muted">The 100 highest-rated Steam games by SteamDB users.</p><div class="nav"><a href="./index.html"><button>← SteamDB Catalog</button></a><a href="../index.html"><button>Home</button></a></div></header><main><div id="games" class="games"></div><div id="empty" class="empty">Loading Top 100…</div></main><dialog id="dialog"><div class="details"><button id="close" style="float:right">✕</button><img id="cover" class="detail-cover" alt=""><h2 id="name"></h2><div id="rating" class="muted"></div><div id="price" class="muted"></div><h3>Rate this game</h3><div id="buttons" class="rating"></div><p id="msg" class="muted rating-message">Choose a rating from 0–10.</p><a id="steam" class="steam" target="_blank" rel="noopener">Open on Steam ↗</a></div></dialog><script>const URL='https://lbuzooszxkygrvyvhpzm.supabase.co',KEY='sb_publishable_kWJWGldsvTjjxKwZaBcq9A_FkZ4M_H9';const $=x=>document.getElementById(x),cover=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/library_600x900.jpg`,header=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/header.jpg`,esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let games=[],sb=null,current=null,busy=false;async function client(){if(sb)return sb;if(!window.supabase){await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=()=>no(new Error('Could not load ratings library.'));document.head.append(s)})}sb=window.supabase.createClient(URL.trim(),KEY.trim(),{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});return sb}function vid(){let m=document.cookie.match(/(?:^|; )gdb_voter=([^;]+)/),id=m?.[1];if(!id){id=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36)+Date.now();document.cookie='gdb_voter='+encodeURIComponent(id)+'; Max-Age=31536000; Path=/; SameSite=Lax'}return decodeURIComponent(id)}async function ratings(){let c=await client(),r=await c.from('ratings').select('id,game_id,rating,voter_id,created_at').like('game_id','steam:%').limit(10000);if(r.error)throw r.error;return r.data||[]}function price(g){if(g.isFree===true||g.price==='free'||Number(g.priceCents)===0)return'Free';let p=g.priceCents!=null?Number(g.priceCents)/100:Number(g.price);return Number.isFinite(p)?'$'+p.toFixed(2):'Price unavailable'}function open(g){current=g;$('cover').src=header(g.id);$('cover').alt=g.title;$('name').textContent=g.title;$('price').textContent='💰 '+price(g);$('steam').href=`https://store.steampowered.com/app/${g.id}/`;let rs=window.currentRatings?.filter(r=>String(r.game_id)==='steam:'+String(g.id))||[];setRating(rs);$('buttons').innerHTML=Array.from({length:11},(_,i)=>`<button data-r="${i}">${i}</button>`).join('');$('buttons').querySelectorAll('button').forEach(b=>b.onclick=()=>rate(Number(b.dataset.r)));$('msg').textContent='Choose a rating from 0–10.';$('dialog').showModal()}function setRating(rs){let n=rs.length,avg=n?rs.reduce((a,r)=>a+Number(r.rating),0)/n:0;$('rating').textContent=n?'⭐ '+avg.toFixed(1)+'/10 · '+n+' ratings':'⭐ Not rated'}async function rate(v){if(busy||!current)return;busy=true;$('msg').textContent='Submitting…';try{let c=await client(),gid='steam:'+String(current.id),voter=vid(),ex=await c.from('ratings').select('id').eq('game_id',gid).eq('voter_id',voter).limit(1);if(ex.error)throw ex.error;let r=ex.data?.length?await c.from('ratings').update({rating:v}).eq('id',ex.data[0].id).eq('voter_id',voter):await c.from('ratings').insert({game_id:gid,rating:v,voter_id:voter});if(r.error)throw r.error;$('msg').textContent='✓ Rated '+v+'/10';window.currentRatings=await ratings();setRating(window.currentRatings.filter(x=>String(x.game_id)===gid));load()}catch(e){$('msg').textContent='Could not submit rating: '+(e?.message||'Unknown error')}finally{busy=false}}async function load(){try{window.currentRatings=await ratings();let map=new Map;for(const r of window.currentRatings){let id=String(r.game_id).replace(/^steam:/,'');let g=games.find(x=>String(x.id)===id);if(!g)continue;let x=map.get(id)||{g,sum:0,n:0};x.sum+=Number(r.rating);x.n++;map.set(id,x)}let top=[...map.values()].map(x=>({...x,a:x.sum/x.n})).filter(x=>x.n>0).sort((a,b)=>b.a-a.a||b.n-a.n).slice(0,100);$('games').innerHTML=top.map((x,i)=>`<article class="card" data-i="${i}"><span class="rank">#${i+1}</span><img class="cover" src="${cover(x.g.id)}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='${header(x.g.id)}'" alt=""><div class="info"><div class="title">${esc(x.g.title)}</div><div class="muted">⭐ ${x.a.toFixed(1)}/10 · ${x.n} ratings</div><div class="muted">💰 ${esc(price(x.g))}</div></div></article>`).join('');$('empty').hidden=top.length>0;document.querySelectorAll('.card').forEach(c=>c.onclick=()=>open(top[Number(c.dataset.i)].g))}catch(e){console.error(e);$('empty').textContent='No Steam user ratings yet.'}}async function init(){try{let r=await fetch('./games.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json();games=Array.isArray(d)?d:(d.games||[]);await load()}catch(e){$('empty').textContent='Could not load the Steam catalog.'}}$('close').onclick=()=>$('dialog').close();init();</script></body></html>
