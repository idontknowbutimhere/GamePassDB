<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SteamDB — Top 100</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f5f5}header,main{max-width:1200px;margin:auto;padding:20px 24px}.nav{display:flex;gap:8px;margin-bottom:20px}button{border:1px solid #333943;border-radius:10px;padding:10px 13px;background:#191c22;color:inherit;font:inherit;cursor:pointer}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.card{background:#191c22;border:1px solid #292e38;border-radius:14px;overflow:hidden;cursor:pointer;position:relative}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#292e38;display:block}.info{padding:11px}.title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:#9da3ad;font-size:13px;margin-top:5px}.rank{position:absolute;top:8px;left:8px;background:#0b0d10dd;border:1px solid #ffffff22;border-radius:8px;padding:5px 8px;font-weight:800}.empty{text-align:center;color:#9da3ad;padding:50px}dialog{width:min(560px,calc(100% - 30px));border:1px solid #333943;border-radius:16px;background:#191c22;color:inherit;padding:0}dialog::backdrop{background:#000b}.details{padding:22px}.detail-cover{width:100%;border-radius:10px}.steam{display:inline-block;margin-top:10px;padding:9px 12px;border-radius:9px;background:#252a33;color:#fff;text-decoration:none}</style></head><body><header><h1>🏆 Steam Top 100</h1><p class="muted">The 100 most popular Steam games in the current SteamDB catalog.</p><div class="nav"><a href="./index.html"><button>← SteamDB Catalog</button></a><a href="../index.html"><button>Home</button></a></div></header><main><div id="games" class="games"></div><div id="empty" class="empty">Loading Top 100…</div></main><dialog id="dialog"><div class="details"><button id="close" style="float:right">✕</button><img id="cover" class="detail-cover" alt=""><h2 id="name"></h2><div id="rating" class="muted"></div><div id="price" class="muted"></div><a id="steam" class="steam" target="_blank" rel="noopener">Open on Steam ↗</a></div></dialog><script>const $=x=>document.getElementById(x),cover=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/library_600x900.jpg`,header=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/header.jpg`,esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let games=[];function rating(g){let p=Number(g.positiveReviews),n=Number(g.negativeReviews);if(Number.isFinite(p)&&Number.isFinite(n)&&p+n)return Math.round(p/(p+n)*100)+'% positive';return g.reviewScore||g.steamRating||'Rating unavailable'}function price(g){if(g.isFree===true||g.price==='free'||Number(g.priceCents)===0)return'Free';let p=g.priceCents!=null?Number(g.priceCents)/100:Number(g.price);return Number.isFinite(p)?'$'+p.toFixed(2):'Price unavailable'}function open(g){$('cover').src=header(g.id);$('cover').alt=g.title;$('name').textContent=g.title;$('rating').textContent='⭐ Steam reviews: '+rating(g);$('price').textContent='💰 '+price(g);$('steam').href=`https://store.steampowered.com/app/${g.id}/`;$('dialog').showModal()}async function load(){try{let r=await fetch('./games.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json();games=Array.isArray(d)?d:(d.games||[]);games.sort((a,b)=>(Number(b.popularityScore)||0)-(Number(a.popularityScore)||0));games=games.slice(0,100);$('games').innerHTML=games.map((g,i)=>`<article class="card" data-i="${i}"><span class="rank">#${i+1}</span><img class="cover" src="${cover(g.id)}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='${header(g.id)}'" alt=""><div class="info"><div class="title">${esc(g.title)}</div><div class="muted">🔥 Popularity #${i+1}</div><div class="muted">⭐ ${esc(rating(g))} · ${esc(price(g))}</div></div></article>`).join('');$('empty').hidden=games.length>0;document.querySelectorAll('.card').forEach(c=>c.onclick=()=>open(games[Number(c.dataset.i)]))}catch(e){$('empty').textContent='Could not load the Steam catalog.'}}$('close').onclick=()=>$('dialog').close();load();</script></body></html>
