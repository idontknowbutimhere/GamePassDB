<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SteamDB — browse and search the Steam catalog."><title>SteamDB</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f5f5}header,main{max-width:1400px;margin:auto;padding:20px 24px}h1{margin:0 0 14px}.nav,.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}a{text-decoration:none}input,select,button{border:1px solid #333943;border-radius:10px;padding:10px 13px;background:#191c22;color:inherit;font:inherit}input{flex:1 1 320px}button{cursor:pointer}button:hover{background:#242832}.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 270px;gap:20px}.side{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:14px}.layout>section{grid-column:2;grid-row:1}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.card{background:#191c22;border:1px solid #292e38;border-radius:14px;overflow:hidden;cursor:pointer}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#292e38;display:block}.card-info{padding:11px}.card h2{font-size:15px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:#9da3ad;font-size:13px}.panel{background:#191c22;border:1px solid #292e38;border-radius:14px;padding:14px}.panel h3{margin:0 0 10px}.empty{color:#9da3ad;padding:40px;text-align:center}.count{margin:0 0 12px;color:#9da3ad;font-size:13px}.site-stats{position:fixed;left:10px;bottom:8px;color:#fff;font:11px ui-monospace,monospace;opacity:.9;z-index:10}dialog{width:min(560px,calc(100% - 30px));border:1px solid #333943;border-radius:16px;background:#191c22;color:inherit;padding:0}dialog::backdrop{background:#000b}.details{padding:22px}.detail-cover{width:min(460px,100%);aspect-ratio:460/215;object-fit:cover;border-radius:10px;display:block;margin:8px auto 18px}.details a{color:#66b3ff}.steam-link{display:inline-block;margin-top:8px;padding:9px 12px;border-radius:9px;background:#252a33;color:#fff}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.layout>section{grid-column:1}}@media(max-width:560px){.side{grid-template-columns:1fr}.games{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header><h1>SteamDB</h1><div class="nav"><a href="../index.html"><button>Home</button></a></div><div class="controls"><input id="search" type="search" placeholder="Search Steam games..."><button id="clear">Clear Search</button><button id="surprise">🎲 Surprise Me</button></div></header><main><div class="layout"><aside class="side"><div class="panel"><h3>🎮 Steam Catalog</h3><div id="meta" class="muted">Loading catalog…</div></div><div class="panel"><h3>About</h3><div class="muted">This catalog is synced automatically from Steam's public app list. Game details and ratings will be added next.</div></div></aside><section><h2 id="title">Steam Games</h2><p id="count" class="count"></p><div id="games" class="games"></div><div id="empty" class="empty" hidden>No games found.</div></section></div></main><div id="stats" class="site-stats">SteamDB · Catalog</div><dialog id="game"><div class="details"><button id="close" style="float:right">✕</button><a href="../index.html"><button>← Home</button></a><img id="dc" class="detail-cover" alt=""><h2 id="dt"></h2><p id="did" class="muted"></p><a id="steam" class="steam-link" target="_blank" rel="noopener">Open on Steam ↗</a></div></dialog><script>let games=[],shown=[],current=null;const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const cover=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/library_600x900.jpg`;const header=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/header.jpg`;function render(){let q=$('search').value.toLowerCase().trim();shown=q?games.filter(g=>g.title.toLowerCase().includes(q)):games;$('count').textContent=`Showing ${Math.min(shown.length,500).toLocaleString()} of ${shown.length.toLocaleString()} matching apps`;$('games').innerHTML=shown.slice(0,500).map(g=>`<article class="card" data-id="${g.id}"><img class="cover" src="${cover(g.id)}" alt="" loading="lazy" onerror="this.onerror=null;this.src='https://cdn.akamai.steamstatic.com/steam/apps/${g.id}/header.jpg'"><div class="card-info"><h2>${esc(g.title)}</h2><div class="muted">Steam App ${g.id}</div></div></article>`).join('');$('empty').hidden=!!shown.length;document.querySelectorAll('.card').forEach(x=>x.onclick=()=>open(x.dataset.id))}function open(id){current=games.find(g=>String(g.id)===String(id));if(!current)return;$('dt').textContent=current.title;$('did').textContent=`Steam App ID: ${current.id}`;$('dc').src=header(current.id);$('dc').alt=current.title;$('steam').href=`https://store.steampowered.com/app/${current.id}/`;$('game').showModal()}async function load(){try{let r=await fetch('./games.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);let d=await r.json();games=Array.isArray(d)?d:(d.games||[]);$('meta').textContent=`${games.length.toLocaleString()} apps · updated ${d.updatedAt?new Date(d.updatedAt).toLocaleString():'unknown'}`;render()}catch(e){console.error(e);$('meta').textContent='Catalog unavailable.';$('empty').hidden=false;$('empty').textContent='The Steam catalog has not been generated yet. Run the “Update Steam catalog” GitHub Action once.'}}$('search').oninput=render;$('clear').onclick=()=>{$('search').value='';render()};$('surprise').onclick=()=>{if(!shown.length)return;open(shown[Math.floor(Math.random()*shown.length)].id)};$('close').onclick=()=>$('game').close();load();</script></body></html>
