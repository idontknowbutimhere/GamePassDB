<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SteamDB — browse, search and rate Steam games."><title>SteamDB</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f5f5}header,main{max-width:1400px;margin:auto;padding:20px 24px}h1{margin:0 0 14px}.nav,.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,button{border:1px solid #333943;border-radius:10px;padding:10px 13px;background:#191c22;color:inherit;font:inherit}input{flex:1 1 250px}button{cursor:pointer}button:hover{background:#242832}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}.side{display:flex;flex-direction:column;gap:14px}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.card{background:#191c22;border:1px solid #292e38;border-radius:14px;overflow:hidden;cursor:pointer;position:relative}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#292e38;display:block}.card-info{padding:11px}.card h2{font-size:15px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:#9da3ad;font-size:13px}.badge{display:inline-block;margin:7px 5px 0 0;padding:4px 7px;border-radius:6px;background:#315d3b;font-size:11px}.panel{background:#191c22;border:1px solid #292e38;border-radius:14px;padding:14px}.panel h3{margin:0 0 10px}.rank{display:grid;grid-template-columns:25px 48px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #292e38;cursor:pointer}.rank:last-child{border-bottom:0}.rank img{width:48px;height:68px;object-fit:cover;border-radius:5px}.rank .rname{font-size:12px}.rank .rscore{font-size:11px;color:#aeb4be}.empty{color:#9da3ad;padding:40px;text-align:center}.site-stats{position:fixed;left:10px;bottom:8px;color:#fff;font:11px ui-monospace,monospace;opacity:.9;z-index:10}dialog{width:min(560px,calc(100% - 30px));border:1px solid #333943;border-radius:16px;background:#191c22;color:inherit;padding:0}dialog::backdrop{background:#000b}.details{padding:22px}.detail-cover{width:min(460px,100%);aspect-ratio:460/215;object-fit:cover;border-radius:10px;display:block;margin:8px auto 18px}.details a{color:#66b3ff}.steam-link{display:inline-block;margin-top:8px;padding:9px 12px;border-radius:9px;background:#252a33;color:#fff}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.ad{grid-column:1/-1}}@media(max-width:560px){.side{grid-template-columns:1fr}.games{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header><h1>SteamDB</h1><div class="nav"><a href="../index.html"><button>Home</button></a><a href="./rankings.html"><button>Rankings</button></a></div><div class="controls"><input id="search" type="search" placeholder="Search games..."><select id="genre"><option value="">All genres</option></select><select id="platform"><option value="">All platforms</option></select><select id="price"><option value="">Any price</option><option value="free">Free</option><option value="0-5">Under $5</option><option value="5-10">$5–$10</option><option value="10-20">$10–$20</option><option value="20-40">$20–$40</option><option value="40+">$40+</option></select><button id="surprise">🎲 Surprise Me</button><button id="clear">Clear Filters</button></div></header><main><div class="layout"><aside class="side"><div class="panel"><h3>📅 Top 10 This Week</h3><div id="week" class="muted">Loading…</div></div><div class="panel"><h3>🔥 Top 10 Today</h3><div id="day" class="muted">Loading…</div></div><div class="panel ad"><h3>Advertisement</h3><div class="muted">Ad space</div></div></aside><section><h2 id="title">Steam Games</h2><div id="games" class="games"></div><div id="empty" class="empty" hidden>No games found.</div></section></div></main><div id="stats" class="site-stats">SteamDB · Catalog</div><dialog id="game"><div class="details"><button id="close" style="float:right">✕</button><a href="../index.html"><button>← Home</button></a><img id="dc" class="detail-cover" alt=""><h2 id="dt"></h2><div id="dr" class="muted"></div><p id="dd" class="muted"></p><div id="dg"></div><p id="dp"></p><a id="steam" class="steam-link" target="_blank" rel="noopener">Open on Steam ↗</a></div></dialog><script>let games=[],current=null;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),cover=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/library_600x900.jpg`,header=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/header.jpg`;function popularity(g){return Number(g.popularityScore)||0}function rating(g){return Number(g.rating??g.steamRating??g.userRating??0)||0}function price(g){if(g.isFree===true||g.price==='free'||Number(g.priceCents)===0)return{v:0,t:'Free'};let p=g.priceCents!=null?Number(g.priceCents)/100:Number(g.price);return Number.isFinite(p)&&p>=0?{v:p,t:'$'+p.toFixed(2)}:{v:null,t:'—'}}function filterGames(){let q=$('search').value.toLowerCase().trim(),ge=$('genre').value,pl=$('platform').value,pr=$('price').value;return games.filter(g=>{let p=price(g),okq=!q||String(g.title).toLowerCase().includes(q),okg=!ge||(g.genres||[]).some(x=>String(x).toLowerCase()===ge.toLowerCase()),okp=!pl||(g.platforms||[]).some(x=>String(x).toLowerCase()===pl.toLowerCase()||String(x).toLowerCase().includes(pl.toLowerCase())),okprice=!pr||(pr==='free'&&p.v===0)||(pr==='0-5'&&p.v>0&&p.v<5)||(pr==='5-10'&&p.v>=5&&p.v<=10)||(pr==='10-20'&&p.v>10&&p.v<=20)||(pr==='20-40'&&p.v>20&&p.v<=40)||(pr==='40+'&&p.v>=40);return okq&&okg&&okp&&okprice})}function card(g){let p=price(g);return `<article class="card" data-id="${g.id}"><img class="cover" src="${cover(g.id)}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${header(g.id)}'"><div class="card-info"><h2>${esc(g.title)}</h2><div class="muted">${esc((g.genres||[]).join(' · '))}</div><div class="muted">${rating(g)?'⭐ '+rating(g).toFixed(1)+'/10':'⭐ Not rated'} · ${p.t}</div>${Number(g.discount)>0?`<span class="badge">-${Number(g.discount)}%</span>`:''}</div></article>`}function render(){let a=filterGames();$('games').innerHTML=a.map(card).join('');$('empty').hidden=!!a.length;document.querySelectorAll('.card').forEach(x=>x.onclick=()=>open(x.dataset.id))}function open(id){current=games.find(g=>String(g.id)===String(id));if(!current)return;let p=price(current);$('dt').textContent=current.title;$('dc').src=header(current.id);$('dc').alt=current.title;$('dr').textContent=`⭐ ${rating(current)?rating(current).toFixed(1)+'/10':'Not rated'} · Popularity rank #${games.indexOf(current)+1}`;$('dd').textContent=current.description||'No description available yet.';$('dg').innerHTML=(current.genres||[]).map(g=>`<span class="badge">${esc(g)}</span>`).join('');$('dp').textContent=`Price: ${p.t}${Number(current.discount)>0?' · -'+Number(current.discount)+'% off':''}`;$('steam').href=`https://store.steampowered.com/app/${current.id}/`;$('game').showModal()}function leaderboard(period){let source=[];fetch('./rankings.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{source=(d&&d[period])||[];let el=$(period==='weekly'?'week':'day');if(!source.length){el.textContent='Ranking data will build as daily snapshots accumulate.';return}el.innerHTML=source.map((g,i)=>`<div class="rank" data-id="${g.id}"><b>#${i+1}</b><img src="${cover(g.id)}"><div><div class="rname">${esc(g.title)}</div><div class="rscore">🔥 ${Number(g.score||0).toLocaleString()}</div></div></div>`).join('');el.querySelectorAll('.rank').forEach(x=>x.onclick=()=>open(x.dataset.id))}).catch(()=>{$(period==='weekly'?'week':'day').textContent='Ranking unavailable.'})}async function load(){try{let r=await fetch('./games.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);let d=await r.json();games=Array.isArray(d)?d:(d.games||[]);games.sort((a,b)=>popularity(b)-popularity(a));$('stats').textContent=`SteamDB · ${games.length.toLocaleString()} games`;let gs=[...new Set(games.flatMap(g=>g.genres||[]))].sort((a,b)=>String(a).localeCompare(String(b)));$('genre').innerHTML='<option value="">All genres</option>'+gs.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');let ps=[...new Set(games.flatMap(g=>(g.platforms||[]).map(String)))].sort();$('platform').innerHTML='<option value="">All platforms</option>'+ps.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');render();leaderboard('weekly');leaderboard('daily')}catch(e){console.error(e);$('empty').hidden=false;$('empty').textContent='Could not load the SteamDB catalog.'}}$('search').oninput=render;$('genre').onchange=render;$('platform').onchange=render;$('price').onchange=render;$('clear').onclick=()=>{$('search').value='';$('genre').value='';$('platform').value='';$('price').value='';render()};$('surprise').onclick=()=>{let a=filterGames();if(a.length)open(a[Math.floor(Math.random()*a.length)].id)};$('close').onclick=()=>$('game').close();load();</script></body></html>
