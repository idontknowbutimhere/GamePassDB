<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SteamDB — browse, search and rate Steam games."><title>SteamDB</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f5f5}header,main{max-width:1400px;margin:auto;padding:20px 24px}h1{margin:0 0 14px}.nav,.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,button{border:1px solid #333943;border-radius:10px;padding:10px 13px;background:#191c22;color:inherit;font:inherit}input{flex:1 1 250px}button{cursor:pointer}button:hover{background:#242832}a{text-decoration:none}.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 270px;gap:20px}.side{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:14px}.right{grid-column:3;grid-row:1}.layout>section{grid-column:2;grid-row:1}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.card{background:#191c22;border:1px solid #292e38;border-radius:14px;overflow:hidden;cursor:pointer}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#292e38;display:block}.card-info{padding:11px}.card h2{font-size:15px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:#9da3ad;font-size:13px}.badge{display:inline-block;margin:7px 5px 0 0;padding:4px 7px;border-radius:6px;background:#315d3b;font-size:11px}.panel{background:#191c22;border:1px solid #292e38;border-radius:14px;padding:14px}.panel h3{margin:0 0 10px}.rank{display:grid;grid-template-columns:25px 48px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #292e38;cursor:pointer}.rank:last-child{border-bottom:0}.rank img{width:48px;height:68px;object-fit:cover;border-radius:5px}.rank .rname{font-size:12px}.rank .rscore{font-size:11px;color:#aeb4be}.empty{color:#9da3ad;padding:40px;text-align:center}.pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px 0}.page-info{min-width:130px;text-align:center;color:#9da3ad;font-size:13px}.site-stats{position:fixed;left:10px;bottom:8px;color:#fff;font:11px ui-monospace,monospace;opacity:.9;z-index:10}dialog{width:min(560px,calc(100% - 30px));border:1px solid #333943;border-radius:16px;background:#191c22;color:inherit;padding:0}dialog::backdrop{background:#000b}.details{padding:22px}.detail-cover{width:min(460px,100%);aspect-ratio:460/215;object-fit:cover;border-radius:10px;display:block;margin:8px auto 18px}.steam-link{display:inline-block;margin-top:8px;padding:9px 12px;border-radius:9px;background:#252a33;color:#fff}.rating{display:flex;flex-wrap:wrap;gap:6px}.rating button{min-width:40px}.rating-message{min-height:20px}@media(max-width:1050px){.layout{grid-template-columns:220px minmax(0,1fr)}.right{display:none}.layout>section{grid-column:2}}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.layout>section{grid-column:1}.right{display:block;grid-column:1}.ad{grid-column:1/-1}}@media(max-width:560px){.side{grid-template-columns:1fr}.games{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header><h1>SteamDB</h1><div class="nav"><a href="../index.html"><button>Home</button></a><a href="./top100.html"><button>🏆 Top 100 All Time</button></a></div><div class="controls"><input id="search" type="search" placeholder="Search games..."><select id="genre"><option value="">All genres</option></select><select id="platform"><option value="">All platforms</option></select><select id="price"><option value="">Any price</option><option value="free">Free</option><option value="0-5">Under $5</option><option value="5-10">$5–$10</option><option value="10-20">$10–$20</option><option value="20-40">$20–$40</option><option value="40+">$40+</option></select><button id="surprise">🎲 Surprise Me</button><button id="clear">Clear Filters</button></div></header><main><div class="layout"><aside class="side"><div class="panel"><h3>📅 Top 10 This Week</h3><div id="week" class="muted">Loading…</div></div><div class="panel"><h3>🔥 Top 10 Today</h3><div id="day" class="muted">Loading…</div></div></aside><section><h2>Steam Games</h2><div id="games" class="games"></div><div id="empty" class="empty" hidden>No games found.</div><div class="pagination"><button id="prev">← Previous</button><span id="pageInfo" class="page-info">Page 1</span><button id="next">Next →</button></div></section><aside class="right"><div class="panel"><h3>Advertisement</h3><div class="muted">Ad space</div></div></aside></div></main><div id="stats" class="site-stats">SteamDB · Catalog</div><dialog id="game"><div class="details"><button id="close" style="float:right">✕</button><a href="../index.html"><button>← Home</button></a><img id="dc" class="detail-cover" alt=""><h2 id="dt"></h2><div id="dr" class="muted"></div><p id="dd" class="muted"></p><div id="dg"></div><p id="dp"></p><h3>Rate this game</h3><div id="rating" class="rating"></div><p id="msg" class="muted rating-message">Choose a rating from 0–10.</p><a id="steam" class="steam-link" target="_blank" rel="noopener">Open on Steam ↗</a></div></dialog><script>const PAGE_SIZE=100,SUPABASE_URL='https://lbuzooszxkygrvyvhpzm.supabase.co',SUPABASE_KEY='sb_publishable_kWJWGldsvTjjxKwZaBcq9A_FkZ4M_H9';let games=[],shown=[],page=1,current=null,sb=null,ratingBusy=false;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const cover=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/library_600x900.jpg`,header=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/header.jpg`;function norm(v){return String(v??'').trim().toLowerCase().replace(/[\u2010-\u2015]/g,'-')}function values(g,key){let v=g[key];if(Array.isArray(v))return v.flatMap(x=>String(x??'').split(/[,;|]/)).map(norm).filter(Boolean);if(typeof v==='string')return v.split(/[,;|]/).map(norm).filter(Boolean);return[]}function popularity(g){return Number(g.popularityScore)||0}function ratingValue(g){return Number(g.rating??g.steamRating??g.userRating??0)||0}function price(g){if(g.isFree===true||g.price==='free'||Number(g.priceCents)===0)return{v:0,t:'Free'};let p=g.priceCents!=null?Number(g.priceCents)/100:Number(g.price);return Number.isFinite(p)&&p>=0?{v:p,t:'$'+p.toFixed(2)}:{v:null,t:'—'}}async function client(){if(sb)return sb;if(!window.supabase){await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=()=>no(new Error('Could not load the ratings library.'));document.head.append(s)})}sb=window.supabase.createClient(SUPABASE_URL.trim(),SUPABASE_KEY.trim(),{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});return sb}function vid(){let m=document.cookie.match(/(?:^|; )gdb_voter=([^;]+)/),id=m?.[1];if(!id){id=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36)+Date.now();document.cookie='gdb_voter='+encodeURIComponent(id)+'; Max-Age=31536000; Path=/; SameSite=Lax'}return decodeURIComponent(id)}async function getRatings(){let c=await client(),r=await c.from('ratings').select('id,game_id,rating,voter_id,created_at').like('game_id','steam:%').limit(10000);if(r.error)throw r.error;return r.data||[]}async function leaderboard(min){let rs=await getRatings(),m=new Map,cut=min?Date.now()-min:0;for(const r of rs){let t=new Date(r.created_at).getTime();if(cut&&(!Number.isFinite(t)||t<cut))continue;let id=String(r.game_id).replace(/^steam:/,'');let g=games.find(x=>String(x.id)===id);if(!g)continue;let x=m.get(id)||{g,sum:0,n:0};x.sum+=Number(r.rating);x.n++;m.set(id,x)}return [...m.values()].map(x=>({...x,a:x.sum/x.n})).sort((a,b)=>b.a-a.a||b.n-a.n).slice(0,10)}function rankHtml(a){return a.length?a.map((x,i)=>`<div class="rank" data-id="${esc(x.g.id)}"><b>#${i+1}</b><img src="${cover(x.g.id)}" onerror="this.onerror=null;this.src='${header(x.g.id)}'"><div><div class="rname">${esc(x.g.title)}</div><div class="rscore">⭐ ${x.a.toFixed(1)} · ${x.n} ratings</div></div></div>`).join(''):'<span class="muted">No ratings yet.</span>'}async function leaders(){try{$('week').innerHTML=rankHtml(await leaderboard(604800000));$('day').innerHTML=rankHtml(await leaderboard(86400000));document.querySelectorAll('.rank').forEach(x=>x.onclick=()=>open(x.dataset.id))}catch(e){console.error('Steam ratings unavailable:',e);$('week').textContent='Ratings unavailable.';$('day').textContent='Ratings unavailable.'}}function filterGames(){let q=norm($('search').value),ge=norm($('genre').value),pl=norm($('platform').value),pr=$('price').value;return games.filter(g=>{let p=price(g),genres=values(g,'genres'),platforms=values(g,'platforms');let okq=!q||norm(g.title).includes(q),okg=!ge||genres.includes(ge),okp=!pl||platforms.includes(pl)||platforms.some(x=>x.includes(pl)),okprice=!pr||(pr==='free'&&p.v===0)||(pr==='0-5'&&p.v>0&&p.v<5)||(pr==='5-10'&&p.v>=5&&p.v<=10)||(pr==='10-20'&&p.v>10&&p.v<=20)||(pr==='20-40'&&p.v>20&&p.v<=40)||(pr==='40+'&&p.v>=40);return okq&&okg&&okp&&okprice})}function card(g){let p=price(g),rv=ratingValue(g);return `<article class="card" data-id="${g.id}"><img class="cover" src="${cover(g.id)}" alt="" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='${header(g.id)}'"><div class="card-info"><h2>${esc(g.title)}</h2><div class="muted">${esc(values(g,'genres').join(' · '))}</div><div class="muted">${rv?'⭐ '+rv.toFixed(1)+'/10':'⭐ Not rated'} · ${p.t}</div>${Number(g.discount)>0?`<span class="badge">-${Number(g.discount)}%</span>`:''}</div></article>`}function render(){shown=filterGames();let pages=Math.max(1,Math.ceil(shown.length/PAGE_SIZE));if(page>pages)page=pages;let start=(page-1)*PAGE_SIZE,visible=shown.slice(start,start+PAGE_SIZE);$('games').innerHTML=visible.map(card).join('');$('empty').hidden=!!visible.length;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('pageInfo').textContent=`Page ${page} of ${pages}`;document.querySelectorAll('.card').forEach(x=>x.onclick=()=>open(x.dataset.id))}async function open(id){current=games.find(g=>String(g.id)===String(id));if(!current)return;let p=price(current);$('dt').textContent=current.title;$('dc').src=header(current.id);$('dc').alt=current.title;$('dd').textContent=current.description||'No description available yet.';$('dg').innerHTML=values(current,'genres').map(g=>`<span class="badge">${esc(g)}</span>`).join('');$('dp').textContent=`Price: ${p.t}${Number(current.discount)>0?' · -'+Number(current.discount)+'% off':''}`;$('steam').href=`https://store.steampowered.com/app/${current.id}/`;let rs=[];try{rs=(await getRatings()).filter(r=>String(r.game_id)==='steam:'+String(current.id))}catch(e){}let n=rs.length;$('dr').textContent=n?'⭐ '+(rs.reduce((a,r)=>a+Number(r.rating),0)/n).toFixed(1)+'/10 · '+n+' ratings':'⭐ Not rated';let r=$('rating');r.innerHTML=Array.from({length:11},(_,i)=>`<button data-r="${i}">${i}</button>`).join('');r.querySelectorAll('button').forEach(b=>b.onclick=()=>rate(Number(b.dataset.r)));$('msg').textContent='Choose a rating from 0–10.';$('game').showModal()}async function rate(v){if(ratingBusy||!current)return;ratingBusy=true;$('msg').textContent='Submitting…';try{let c=await client(),gid='steam:'+String(current.id),voter=vid();let existing=await c.from('ratings').select('id').eq('game_id',gid).eq('voter_id',voter).limit(1);if(existing.error)throw existing.error;let r=existing.data?.length?await c.from('ratings').update({rating:v}).eq('id',existing.data[0].id).eq('voter_id',voter):await c.from('ratings').insert({game_id:gid,rating:v,voter_id:voter});if(r.error)throw r.error;$('msg').textContent='✓ Rated '+v+'/10';let rs=(await getRatings()).filter(x=>String(x.game_id)===gid),n=rs.length;$('dr').textContent=n?'⭐ '+(rs.reduce((a,x)=>a+Number(x.rating),0)/n).toFixed(1)+'/10 · '+n+' ratings':'⭐ Not rated';leaders()}catch(e){console.error('Steam rating submission failed:',e);$('msg').textContent='Could not submit rating: '+(e?.message||'Unknown error')}finally{ratingBusy=false}}async function load(){try{let r=await fetch('./games.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);let d=await r.json();games=Array.isArray(d)?d:(d.games||[]);games.sort((a,b)=>popularity(b)-popularity(a));$('stats').textContent=`SteamDB · ${games.length.toLocaleString()} games`;let gs=[...new Set(games.flatMap(g=>values(g,'genres')))].sort();$('genre').innerHTML='<option value="">All genres</option>'+gs.map(x=>`<option value="${esc(x)}">${esc(x.replace(/\b\w/g,c=>c.toUpperCase()))}</option>`).join('');let ps=[...new Set(games.flatMap(g=>values(g,'platforms')))].sort();$('platform').innerHTML='<option value="">All platforms</option>'+ps.map(x=>`<option value="${esc(x)}">${esc(x.replace(/\b\w/g,c=>c.toUpperCase()))}</option>`).join('');render();leaders()}catch(e){console.error(e);$('empty').hidden=false;$('empty').textContent='Could not load the SteamDB catalog.'}}$('search').oninput=()=>{page=1;render()};$('genre').onchange=()=>{page=1;render()};$('platform').onchange=()=>{page=1;render()};$('price').onchange=()=>{page=1;render()};$('clear').onclick=()=>{$('search').value='';$('genre').value='';$('platform').value='';$('price').value='';page=1;render()};$('surprise').onclick=()=>{if(shown.length)open(shown[Math.floor(Math.random()*shown.length)].id)};$('prev').onclick=()=>{if(page>1){page--;render();window.scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=()=>{let pages=Math.max(1,Math.ceil(shown.length/PAGE_SIZE));if(page<pages){page++;render();window.scrollTo({top:0,behavior:'smooth'})}};$('close').onclick=()=>$('game').close();load();</script></body></html>
