<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SteamDB — browse, search and rate Steam games."><title>SteamDB</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f5f5}header,main{max-width:1400px;margin:auto;padding:20px 24px}.nav,.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,button{border:1px solid #333943;border-radius:10px;padding:10px 13px;background:#191c22;color:inherit;font:inherit}input{flex:1 1 250px}button{cursor:pointer}button:disabled{opacity:.45}a{text-decoration:none}.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 260px;gap:20px}.side{display:flex;flex-direction:column;gap:14px}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.card{background:#191c22;border:1px solid #292e38;border-radius:14px;overflow:hidden;cursor:pointer}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#292e38;display:block}.card-info{padding:11px}.card h2{font-size:15px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:#9da3ad;font-size:13px}.panel{background:#191c22;border:1px solid #292e38;border-radius:14px;padding:14px}.panel h3{margin:0 0 10px}.rank{display:grid;grid-template-columns:24px 45px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #292e38;cursor:pointer}.rank img{width:45px;height:64px;object-fit:cover;border-radius:5px}.rname{font-size:12px}.rscore{font-size:11px;color:#aeb4be}.badge{display:inline-block;margin:7px 5px 0 0;padding:4px 7px;border-radius:6px;background:#315d3b;font-size:11px}.empty{text-align:center;color:#9da3ad;padding:40px}.pagination{display:flex;justify-content:center;gap:10px;margin:22px 0}.page-info{min-width:130px;text-align:center;color:#9da3ad;font-size:13px}.right{display:flex}.ad{width:100%;height:max-content}.site-stats{position:fixed;left:10px;bottom:8px;font:11px ui-monospace,monospace;opacity:.9}dialog{width:min(560px,calc(100% - 30px));border:1px solid #333943;border-radius:16px;background:#191c22;color:inherit;padding:0}dialog::backdrop{background:#000b}.details{padding:22px}.detail-cover{width:100%;border-radius:10px}.rating{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rating button{min-width:40px}@media(max-width:1050px){.layout{grid-template-columns:220px minmax(0,1fr)}.right{display:none}}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.right{display:block}.layout>section{grid-column:1}.right{grid-column:1}}@media(max-width:560px){.side{grid-template-columns:1fr}.games{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header><h1>SteamDB</h1><div class="nav"><a href="../index.html"><button>Home</button></a><a href="./top100.html"><button>🏆 Top 100 All Time</button></a></div><div class="controls"><input id="search" type="search" placeholder="Search games..."><select id="genre"><option value="">All genres</option></select><select id="platform"><option value="">All platforms</option></select><select id="price"><option value="">Any price</option><option value="free">Free</option><option value="0-5">Under $5</option><option value="5-10">$5–$10</option><option value="10-20">$10–$20</option><option value="20-40">$20–$40</option><option value="40+">$40+</option></select><button id="surprise">🎲 Surprise Me</button><button id="clear">Clear Filters</button></div></header><main><div class="layout"><aside class="side"><div class="panel"><h3>🔥 Top 10 Today</h3><div id="day" class="muted">Loading…</div></div><div class="panel"><h3>📅 Top 10 This Week</h3><div id="week" class="muted">Loading…</div></div></aside><section><h2>Steam Games</h2><div id="games" class="games"></div><div id="empty" class="empty" hidden>No games found.</div><div class="pagination"><button id="prev">← Previous</button><span id="pageInfo" class="page-info">Page 1</span><button id="next">Next →</button></div></section><aside class="side right"><div class="panel ad"><h3>Advertisement</h3><div class="muted">Ad space</div></div></aside></div></main><div id="stats" class="site-stats">SteamDB · Catalog</div><dialog id="game"><div class="details"><button id="close" style="float:right">✕</button><a href="../index.html"><button>← Home</button></a><img id="dc" class="detail-cover"><h2 id="dt"></h2><div id="dr" class="muted"></div><p id="dd" class="muted"></p><p id="dp"></p><div><b>Rate this game</b><div id="rating" class="rating"></div><p id="msg" class="muted">Choose a rating from 0–10.</p></div><a id="steam" target="_blank" rel="noopener"><button>Open on Steam ↗</button></a></div></dialog><script>const PAGE_SIZE=100,SUPABASE_URL='https://lbuzooszxkygrvyvhpzm.supabase.co',SUPABASE_KEY='sb_publishable_kWJWGldsvTjjxKwZaBcq9A_FkZ4M_H9';let games=[],shown=[],page=1,current=null,sb=null,busy=false;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),norm=v=>String(v??'').trim().toLowerCase(),cover=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/library_600x900.jpg`,header=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/header.jpg`;function arr(g,k){let v=g?.[k];if(Array.isArray(v))return v.flatMap(x=>String(x??'').split(/[,;|]/)).map(norm).filter(Boolean);if(typeof v==='string')return v.split(/[,;|]/).map(norm).filter(Boolean);return[]}function num(v){if(v==null||v==='')return NaN;let s=String(v).replace(/[^0-9.,-]/g,'').replace(',','.');return Number(s)}function getPrice(g){if(g.isFree===true||norm(g.price)==='free'||g.priceCents===0||g.priceCents==='0')return{v:0,t:'Free'};let c=num(g.priceCents);if(Number.isFinite(c))return{v:c>1000?c/100:c,t:'$'+(c>1000?c/100:c).toFixed(2)};let p=num(g.price);return Number.isFinite(p)?{v:p,t:'$'+p.toFixed(2)}:{v:null,t:'—'}}function popularity(g){return num(g.popularityScore)||num(g.popularity)||num(g.steamPopularity)||0}async function client(){if(sb)return sb;if(!window.supabase){await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=()=>no(Error('Ratings library unavailable'));document.head.append(s)})}sb=window.supabase.createClient(SUPABASE_URL.trim(),SUPABASE_KEY.trim(),{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});return sb}function voter(){let m=document.cookie.match(/(?:^|; )steamdb_voter=([^;]+)/),id=m?.[1];if(!id){id=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36)+Date.now();document.cookie='steamdb_voter='+encodeURIComponent(id)+'; Max-Age=31536000; Path=/; SameSite=Lax'}return decodeURIComponent(id)}async function ratings(){let r=await (await client()).from('ratings').select('id,game_id,rating,voter_id,created_at').like('game_id','steam:%').limit(10000);if(r.error)throw r.error;return r.data||[]}async function rank(period){let rs=await ratings(),cut=Date.now()-period,m=new Map;for(let r of rs){let t=new Date(r.created_at).getTime();if(!Number.isFinite(t)||t<cut)continue;let id=String(r.game_id).replace(/^steam:/,''),g=games.find(x=>String(x.id)===id);if(!g)continue;let x=m.get(id)||{g,sum:0,n:0};x.sum+=Number(r.rating);x.n++;m.set(id,x)}return [...m.values()].map(x=>({...x,a:x.sum/x.n})).sort((a,b)=>b.a-a.a||b.n-a.n).slice(0,10)}function rankHtml(a){return a.length?a.map((x,i)=>`<div class="rank" data-id="${esc(x.g.id)}"><b>#${i+1}</b><img src="${cover(x.g.id)}" onerror="this.onerror=null;this.src='${header(x.g.id)}'"><div><div class="rname">${esc(x.g.title)}</div><div class="rscore">⭐ ${x.a.toFixed(1)} · ${x.n} ratings</div></div></div>`).join(''):'<span class="muted">No ratings yet.</span>'}async function leaders(){try{$('day').innerHTML=rankHtml(await rank(86400000));$('week').innerHTML=rankHtml(await rank(604800000));document.querySelectorAll('.rank').forEach(x=>x.onclick=()=>openGame(x.dataset.id))}catch(e){console.error(e);$('day').textContent='Ratings unavailable.';$('week').textContent='Ratings unavailable.'}}function filtered(){let q=norm($('search').value),ge=norm($('genre').value),pl=norm($('platform').value),pr=$('price').value;return games.filter(g=>{let p=getPrice(g),genres=arr(g,'genres'),plats=arr(g,'platforms');return(!q||norm(g.title).includes(q))&&(!ge||genres.includes(ge))&&(!pl||plats.includes(pl)||plats.some(x=>x===pl||x.includes(pl)))&&(!pr||(pr==='free'&&p.v===0)||(pr==='0-5'&&p.v>0&&p.v<5)||(pr==='5-10'&&p.v>=5&&p.v<=10)||(pr==='10-20'&&p.v>10&&p.v<=20)||(pr==='20-40'&&p.v>20&&p.v<=40)||(pr==='40+'&&p.v>=40))})}function render(){shown=filtered();let pages=Math.max(1,Math.ceil(shown.length/PAGE_SIZE));page=Math.min(page,pages);let vis=shown.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);$('games').innerHTML=vis.map(g=>{let p=getPrice(g);return`<article class="card" data-id="${esc(g.id)}"><img class="cover" src="${cover(g.id)}" loading="lazy" onerror="this.onerror=null;this.src='${header(g.id)}'" alt=""><div class="card-info"><h2>${esc(g.title)}</h2><div class="muted">${esc(arr(g,'genres').join(' · '))}</div><div class="muted">${p.t}</div></div></article>`}).join('');$('empty').hidden=vis.length>0;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('pageInfo').textContent=`Page ${page} of ${pages}`;document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openGame(x.dataset.id))}async function openGame(id){current=games.find(g=>String(g.id)===String(id));if(!current)return;let p=getPrice(current);$('dt').textContent=current.title;$('dc').src=header(current.id);$('dc').alt=current.title;$('dd').textContent=current.description||'No description available yet.';$('dp').textContent='Price: '+p.t;$('steam').href=`https://store.steampowered.com/app/${current.id}/`;let rs=[];try{rs=(await ratings()).filter(r=>String(r.game_id)==='steam:'+current.id)}catch(e){}let n=rs.length;$('dr').textContent=n?'⭐ '+(rs.reduce((a,r)=>a+Number(r.rating),0)/n).toFixed(1)+'/10 · '+n+' ratings':'⭐ Not rated';$('rating').innerHTML=Array.from({length:11},(_,i)=>`<button data-r="${i}">${i}</button>`).join('');$('rating').querySelectorAll('button').forEach(b=>b.onclick=()=>rate(Number(b.dataset.r)));$('msg').textContent='Choose a rating from 0–10.';$('game').showModal()}async function rate(v){if(busy)return;busy=true;$('msg').textContent='Submitting…';try{let c=await client(),gid='steam:'+current.id,id=voter(),e=await c.from('ratings').select('id').eq('game_id',gid).eq('voter_id',id).limit(1);if(e.error)throw e.error;let r=e.data?.length?await c.from('ratings').update({rating:v}).eq('id',e.data[0].id).eq('voter_id',id):await c.from('ratings').insert({game_id:gid,rating:v,voter_id:id});if(r.error)throw r.error;$('msg').textContent='✓ Rated '+v+'/10';leaders()}catch(e){$('msg').textContent='Could not submit rating: '+(e.message||'Unknown error')}finally{busy=false}}async function load(){try{let r=await fetch('./games.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();games=Array.isArray(d)?d:(d.games||d.data||d.results||[]);$('stats').textContent='SteamDB · '+games.length.toLocaleString()+' games';let genres=[...new Set(games.flatMap(g=>arr(g,'genres')))].sort(),plats=[...new Set(games.flatMap(g=>arr(g,'platforms')))].sort();$('genre').innerHTML='<option value="">All genres</option>'+genres.map(x=>`<option value="${esc(x)}">${esc(x.replace(/\b\w/g,c=>c.toUpperCase()))}</option>`).join('');$('platform').innerHTML='<option value="">All platforms</option>'+plats.map(x=>`<option value="${esc(x)}">${esc(x.replace(/\b\w/g,c=>c.toUpperCase()))}</option>`).join('');render();leaders()}catch(e){$('empty').hidden=false;$('empty').textContent='Could not load the SteamDB catalog: '+e.message}}['search','genre','platform','price'].forEach(id=>$(id).oninput=()=>{page=1;render()});$('clear').onclick=()=>{$('search').value='';$('genre').value='';$('platform').value='';$('price').value='';page=1;render()};$('surprise').onclick=()=>{if(shown.length)openGame(shown[Math.floor(Math.random()*shown.length)].id)};$('prev').onclick=()=>{if(page>1){page--;render();scrollTo(0,0)}};$('next').onclick=()=>{let pages=Math.max(1,Math.ceil(shown.length/PAGE_SIZE));if(page<pages){page++;render();scrollTo(0,0)}};$('close').onclick=()=>$('game').close();load();</script></body></html>
