<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SteamDB Rankings</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f5f5}header,main{max-width:1100px;margin:auto;padding:22px 24px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,button{color:inherit;background:#191c22;border:1px solid #333943;border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab.active{background:#303640}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:42px 72px 1fr auto;align-items:center;gap:14px;padding:10px;background:#191c22;border:1px solid #292e38;border-radius:12px;cursor:pointer}.row:hover{background:#242832}.cover{width:72px;height:100px;object-fit:cover;border-radius:7px;background:#292e38}.name{font-size:17px}.score{text-align:right;color:#c7ccd4}.muted{color:#9da3ad;font-size:13px}.error{padding:18px;border:1px solid #593333;background:#211718;border-radius:12px}@media(max-width:600px){.row{grid-template-columns:30px 55px 1fr}.cover{width:55px;height:78px}.score{font-size:12px}.name{font-size:14px}}</style></head><body><header><div class="nav"><a href="./index.html">← SteamDB</a><a href="../index.html">Home</a></div><h1 id="title">SteamDB Rankings</h1><p id="desc" class="muted">Top 10 games today.</p><div class="tabs"><button class="tab active" data-tab="daily">🔥 Top 10 Today</button><button class="tab" data-tab="weekly">📅 Top 10 This Week</button><button class="tab" data-tab="allTime">🏆 Top 100 All Time</button></div></header><main><div id="list" class="list"><p class="muted">Loading rankings…</p></div></main><script>const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const cover=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/library_600x900.jpg`;let rankings=null,tab='daily';async function load(){try{let r=await fetch('./rankings.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);rankings=await r.json();render()}catch(e){document.getElementById('list').innerHTML='<div class="error">Rankings are not available yet. Run the Update Steam catalog Action.</div>'}}function render(){let data=rankings?.[tab]||[];document.getElementById('title').textContent=tab==='daily'?'SteamDB — Top 10 Today':tab==='weekly'?'SteamDB — Top 10 This Week':'SteamDB — Top 100 All Time';document.getElementById('desc').textContent=tab==='daily'?'The 10 most popular Steam games in the latest daily snapshot.':tab==='weekly'?'The 10 strongest Steam games across the latest 7 daily snapshots.':'The 100 most popular Steam games in the catalog.';document.getElementById('list').innerHTML=data.length?data.map(g=>`<div class="row" data-id="${g.id}"><b>#${g.rank}</b><img class="cover" src="${cover(g.id)}" alt="" loading="lazy"><span class="name">${esc(g.title)}</span><span class="score">🔥 ${Number(g.score||0).toLocaleString()}<br>${g.appearances?g.appearances+' day'+(g.appearances===1?'':'s'):''}</span></div>`).join(''):'<p class="muted">No ranking data yet.</p>';document.querySelectorAll('.row').forEach(x=>x.onclick=()=>location.href='./index.html?game='+encodeURIComponent(x.dataset.id))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});load();</script></body></html>
