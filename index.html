<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GamePassDB</title><style>*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#f5f5f5;font-family:system-ui,sans-serif}header{max-width:1500px;margin:auto;padding:22px 24px}h1{margin:0 0 14px}.nav,.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button,select,input,.btn{background:#191c22;color:#fff;border:1px solid #333943;border-radius:10px;padding:10px 13px;font:inherit}button,.btn{cursor:pointer;text-decoration:none}.filters input{flex:1 1 250px}main{max-width:1500px;margin:auto;padding:10px 24px 50px}.three-col{display:grid;grid-template-columns:250px minmax(0,900px) 250px;justify-content:center;gap:24px;align-items:start}.left,.right{display:grid;gap:16px}.panel{background:#191c22;border:1px solid #292e38;border-radius:14px;padding:14px}.panel h3{margin:0 0 12px;font-size:16px}.rank{display:grid;grid-template-columns:22px 42px minmax(0,1fr);gap:8px;align-items:center;padding:8px 4px;border-radius:8px;cursor:pointer}.rank:hover{background:#242832}.rank img{width:42px;height:59px;object-fit:cover;border-radius:5px}.rank-name{font-size:12px;line-height:1.25}.score{color:#bfc5ce;font-size:11px}.adbox{height:160px;border:1px dashed #414753;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#737b88;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.games{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#191c22;border:1px solid #292e38;border-radius:14px;overflow:hidden;cursor:pointer}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#292e38}.info{padding:11px}.info h2{font-size:15px;margin:0 0 5px}.muted{color:#9da3ad;font-size:12px}.badge{display:inline-block;margin:5px 4px 0 0;padding:4px 7px;border-radius:6px;background:#7a3030;font-size:11px}.platform{background:#344d70}.indie{background:#315d3b}.empty{text-align:center;color:#9da3ad;padding:40px}.version{position:fixed;left:10px;bottom:7px;color:#fff;font:11px monospace;opacity:.9}@media(max-width:1200px){.three-col{grid-template-columns:210px minmax(0,1fr) 210px}.games{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:900px){.three-col{grid-template-columns:1fr}.left{grid-template-columns:1fr 1fr}.games{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:600px){.left{grid-template-columns:1fr}.games{grid-template-columns:repeat(2,minmax(0,1fr))}}dialog{background:#191c22;color:#fff;border:1px solid #333943;border-radius:16px;max-width:560px;width:calc(100% - 30px)}dialog::backdrop{background:#000b}.details{padding:22px}.detail-cover{width:210px;max-width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;display:block;margin:10px auto 18px}.rating{display:flex;flex-wrap:wrap;gap:6px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#252a33;padding:5px 8px;border-radius:7px}.desc{line-height:1.6;color:#d4d7dc}</style></head><body><header><h1>GamePassDB</h1><nav class="nav"><button id="homeBtn">Home</button><button id="removedBtn">Removed Games</button><a class="btn" href="./top100.html">Top 100 Rated</a></nav><div class="filters"><input id="search" placeholder="Search games..."><select id="genre"><option value="">All genres</option></select><select id="platform"><option value="">All platforms</option><option>Xbox</option><option>PC</option><option>Cloud</option></select><select id="status"><option value="active">Current games</option><option value="leaving">Leaving soon</option><option value="removed">Removed games</option><option value="">All games</option></select><button id="clear">Clear filters</button><button id="surprise">🎲 Surprise Me</button></div></header><main><div class="three-col"><aside class="left"><section class="panel"><h3>⭐ Top 10 Today</h3><div id="today" class="muted">Loading…</div></section><section class="panel"><h3>🔥 Top 10 This Week</h3><div id="week" class="muted">Loading…</div></section></aside><section class="catalog"><h2 id="title">Current Game Pass Games</h2><div id="games" class="games"></div><div id="empty" class="empty" hidden>No games found.</div></section><aside class="right"><section class="panel"><h3>Advertisement</h3><div class="adbox">Ad space</div></section></aside></div></main><div class="version">v0.2.5 · Visitors: —</div><dialog id="game"><div class="details"><button id="closeGame" style="float:right">✕</button><button id="modalHome">← Home</button><img id="dc" class="detail-cover"><h2 id="dt"></h2><div id="dr" class="muted"></div><div id="db" class="chips"></div><p id="dd" class="desc"></p><div id="dg" class="chips"></div><p id="ds"></p><h3>Rate this game</h3><div id="rating" class="rating"></div><p id="rm" class="muted">Choose 0–10.</p></div></dialog><dialog id="surpriseDialog"><div class="details"><button id="closeSurprise" style="float:right">✕</button><h2>Surprise Me</h2><p class="muted">Pick a category.</p><button data-surprise="any">Any game</button> <button data-surprise="indie">Indie</button> <button data-surprise="nonindie">Non-indie</button></div></dialog><script>const SUPABASE_URL='https://lbuzooszxkygrvyvhpzm.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_kWJWGldsvTjjxKwZaBcq9A_FkZ4M_H9';let games=[],cur=null,client;const $=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function listValues(g,key){let v=g?.[key];if(Array.isArray(v))return v.map(x=>String(x).trim()).filter(Boolean);if(v==null)return[];return String(v).split(/[,|]/).map(x=>x.trim()).filter(Boolean)}function indie(g){return g.indie===true||String(g.indie).toLowerCase()==='true'||listValues(g,'genres').some(x=>x.toLowerCase()==='indie')}function isLeaving(g){return g.leavingSoon===true||String(g.leavingSoon).toLowerCase()==='true'}function isRemoved(g){return String(g.status||'active').toLowerCase()==='removed'}function badges(g){return listValues(g,'platforms').map(x=>'<span class="badge platform">'+esc(x)+'</span>').join('')+(indie(g)?'<span class="badge indie">Indie</span>':'')+(isLeaving(g)?'<span class="badge">Leaving soon</span>':'')+(isRemoved(g)?'<span class="badge">Removed</span>':'')}function matches(g){const q=$('search').value.trim().toLowerCase(),p=$('platform').value.trim().toLowerCase(),ge=$('genre').value.trim().toLowerCase(),s=$('status').value;const title=String(g.title||'').toLowerCase();const genres=listValues(g,'genres').map(x=>x.toLowerCase());const platforms=listValues(g,'platforms').map(x=>x.toLowerCase());return(!q||title.includes(q))&&(!p||platforms.includes(p)||platforms.some(x=>x.includes(p)))&&(!ge||genres.includes(ge)||(ge==='indie'&&indie(g)))&&(!s||(s==='leaving'?isLeaving(g):s==='removed'?isRemoved(g):s==='active'&&!isRemoved(g)))}function filtered(){return games.filter(matches)}function render(){const list=filtered(),s=$('status').value;$('title').textContent=s==='removed'?'Removed Games':s==='leaving'?'Leaving Soon':'Current Game Pass Games';$('games').innerHTML=list.map(g=>'<article class="card" data-id="'+esc(g.id||g.title)+'"><img class="cover" loading="lazy" src="'+esc(g.cover||'')+'" alt="'+esc(g.title)+' cover"><div class="info"><h2>'+esc(g.title)+'</h2><div class="muted">'+esc(listValues(g,'genres').join(' · '))+'</div>'+badges(g)+'</div></article>').join('');$('empty').hidden=list.length>0;document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openGame(x.dataset.id))}function draw(id,rows){const el=$(id);el.innerHTML=rows.map((r,i)=>{const g=games.find(x=>String(x.id||x.title)===String(r.id));return g?'<div class="rank" data-id="'+esc(g.id||g.title)+'"><b>#'+(i+1)+'</b><img loading="lazy" src="'+esc(g.cover||'')+'" alt=""><span class="rank-name">'+esc(g.title)+'<br><span class="score">⭐ '+r.avg.toFixed(1)+' · '+r.count+' vote'+(r.count===1?'':'s')+'</span></span></div>':''}).join('')||'<span class="muted">No ratings yet.</span>';el.querySelectorAll('.rank').forEach(x=>x.onclick=()=>openGame(x.dataset.id))}async function sb(){if(client)return client;if(!window.supabase)await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});return client}async function rankings(){try{const{data,error}=await(await sb()).from('ratings').select('game_id,rating,created_at');if(error)throw error;const now=Date.now(),day=new Date();day.setHours(0,0,0,0);function make(since){const m={};(data||[]).filter(r=>new Date(r.created_at).getTime()>=since).forEach(r=>{const k=String(r.game_id);m[k]??={sum:0,count:0};m[k].sum+=Number(r.rating);m[k].count++});return Object.entries(m).map(([id,x])=>({id,avg:x.sum/x.count,count:x.count})).sort((a,b)=>b.avg-a.avg||b.count-a.count).slice(0,10)}draw('today',make(day.getTime()));draw('week',make(now-7*864e5))}catch(e){$('today').textContent=$('week').textContent='Ratings unavailable.'}}async function refreshRating(g){try{const{data,error}=await(await sb()).from('ratings').select('rating').eq('game_id',String(g.id||g.title));if(error)throw error;const n=data?.length||0,avg=n?data.reduce((a,r)=>a+Number(r.rating),0)/n:0;$('dr').textContent=n?'⭐ '+avg.toFixed(1)+'/10 · '+n+' ratings':'⭐ Not rated yet'}catch(e){$('dr').textContent='⭐ Rating unavailable'}}async function openGame(id){cur=games.find(g=>String(g.id||g.title)===String(id));if(!cur)return;$('dc').src=cur.cover||'';$('dt').textContent=cur.title;$('dd').textContent=cur.description||'No description available yet.';$('db').innerHTML=badges(cur);$('dg').innerHTML=listValues(cur,'genres').map(x=>'<span class="chip">'+esc(x)+'</span>').join('');$('ds').textContent=isRemoved(cur)?'Removed from Game Pass':isLeaving(cur)?'🕐 Leaving soon':'Available on Game Pass';$('rating').innerHTML=Array.from({length:11},(_,i)=>'<button data-r="'+i+'">'+i+'</button>').join('');$('rating').querySelectorAll('button').forEach(b=>b.onclick=()=>rate(Number(b.dataset.r)));await refreshRating(cur);$('game').showModal()}async function rate(v){if(!cur)return;const msg=$('rm');try{msg.textContent='Submitting…';const{error}=await(await sb()).from('ratings').insert({game_id:String(cur.id||cur.title),rating:v});if(error)throw error;msg.textContent='✓ Rated '+v+'/10';await refreshRating(cur);await rankings()}catch(e){console.error(e);msg.textContent='Could not submit rating: '+(e?.message||e?.details||e?.hint||'Supabase rejected the request')}}function surprise(kind){let list=games.filter(g=>!isRemoved(g));if(kind==='indie')list=list.filter(indie);if(kind==='nonindie')list=list.filter(g=>!indie(g));if(!list.length){alert('No games match that choice.');return}$('surpriseDialog').close();openGame(list[Math.floor(Math.random()*list.length)].id)}async function load(){try{const r=await fetch('./games.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('games.json returned '+r.status);const d=await r.json();games=Array.isArray(d)?d:(d.games||d.active||[]);const genres=[...new Set(games.flatMap(g=>listValues(g,'genres')).filter(x=>x.toLowerCase()!=='indie'))].sort((a,b)=>a.localeCompare(b));$('genre').innerHTML='<option value="">All genres</option><option value="indie">Indie</option>'+genres.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');render();rankings()}catch(e){console.error(e);$('games').innerHTML='';$('empty').hidden=false;$('empty').textContent='Could not load the game catalog.'}}function clearFilters(){ $('search').value='';$('genre').value='';$('platform').value='';$('status').value='active';render()}$('clear').onclick=clearFilters;$('homeBtn').onclick=clearFilters;$('removedBtn').onclick=()=>{$('status').value='removed';render()};$('closeGame').onclick=()=>$('game').close();$('modalHome').onclick=()=>{$('game').close();clearFilters()};$('surprise').onclick=()=>$('surpriseDialog').showModal();$('closeSurprise').onclick=()=>$('surpriseDialog').close();document.querySelectorAll('[data-surprise]').forEach(b=>b.onclick=()=>surprise(b.dataset.surprise));['search','genre','platform','status'].forEach(id=>{$(id).addEventListener('input',render);$(id).addEventListener('change',render)});load();</script></body></html>
