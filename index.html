<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GamePassDB</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f5f5}header{padding:22px 24px;max-width:1200px;margin:auto}h1{margin:0 0 16px}.nav{display:flex;gap:8px;margin-bottom:12px}.controls{display:flex;flex-wrap:wrap;gap:10px}input,select,button{border:1px solid #333943;border-radius:10px;padding:11px 14px;background:#191c22;color:inherit;font:inherit}input{flex:1 1 260px}button{cursor:pointer}button:hover{background:#242832}button:disabled{opacity:.5;cursor:wait}main{max-width:1200px;margin:auto;padding:10px 24px 40px}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}.card{background:#191c22;border:1px solid #292e38;border-radius:14px;overflow:hidden;cursor:pointer}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#292e38;display:block}.card-info{padding:12px}.card h2{font-size:16px;margin:0 0 6px}.muted{color:#9da3ad;font-size:13px}.badge{display:inline-block;margin-top:8px;padding:4px 7px;border-radius:6px;background:#7a3030;font-size:12px}.empty{color:#9da3ad;padding:40px;text-align:center}dialog{width:min(560px,calc(100% - 30px));border:1px solid #333943;border-radius:16px;background:#191c22;color:inherit;padding:0}dialog::backdrop{background:#000b}.details{padding:22px}.detail-cover{width:min(220px,100%);aspect-ratio:2/3;object-fit:cover;border-radius:10px;display:block;margin:8px auto 18px}.rating{display:flex;flex-wrap:wrap;gap:6px}.rating button{min-width:40px}.description{line-height:1.6;color:#d4d7dc}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:5px 8px;background:#252a33;border-radius:7px}.rating-message{min-height:20px}.site-stats{position:fixed;left:10px;bottom:8px;color:#fff;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.9;z-index:10}.section-title{margin:0 0 18px}</style></head><body><header><h1>GamePassDB</h1><div class="nav"><button id="homeNav">Home</button><button id="removedNav">Removed Games</button></div><div class="controls"><input id="search" type="search" placeholder="Search games..."><select id="genre"><option value="">All genres</option></select><select id="status"><option value="active">Current games</option><option value="leaving">Leaving soon</option><option value="removed">Removed games</option><option value="">All games</option></select><button id="surprise">🎲 Surprise Me</button></div></header><main><h2 id="sectionTitle" class="section-title">Current Game Pass Games</h2><div id="games" class="games"></div><div id="empty" class="empty" hidden>No games found.</div></main><div id="siteStats" class="site-stats">v0.1.2 · Visitors: —</div><dialog id="surpriseDialog"><div class="details"><button id="closeSurprise" style="float:right">✕</button><h2>Surprise Me</h2><p class="muted">Choose one, or leave both blank for any game.</p><button data-indie="true">Indie</button> <button data-indie="false">Not Indie</button> <button data-indie="">Any</button></div></dialog><dialog id="gameDialog"><div class="details"><button id="closeGame" style="float:right">✕</button><button id="home">← Home</button><img id="detailCover" class="detail-cover"><h2 id="detailTitle"></h2><div id="detailRating" class="muted">⭐ Not rated yet</div><p id="detailDescription" class="description"></p><div id="detailGenres" class="chips"></div><p id="detailStatus"></p><h3>Rate this game</h3><div id="rating" class="rating"></div><p id="selectedRating" class="muted rating-message">Choose a rating from 0–10.</p></div></dialog><script>const SUPABASE_URL='https://lbuzooszxkygrvyvhpzm.supabase.co',SUPABASE_PUBLISHABLE_KEY='sb_publishable_kWJWGldsvTjjxKwZaBcq9A_FkZ4M_H9';let games=[],currentGame=null,supabaseClient=null,removedMode=false;const gamesEl=document.getElementById('games'),emptyEl=document.getElementById('empty'),searchEl=document.getElementById('search'),genreEl=document.getElementById('genre'),statusEl=document.getElementById('status'),dialog=document.getElementById('gameDialog'),surpriseDialog=document.getElementById('surpriseDialog');function escapeHtml(v){return String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function coverUrl(v){return v?(v.startsWith('//')?'https:'+v:v):''}function voterId(){let id=document.cookie.match(/(?:^|; )gdb_voter=([^;]+)/)?.[1];if(!id){id=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();document.cookie='gdb_voter='+id+'; Max-Age=31536000; Path=/; SameSite=Lax'}return id}async function getSupabase(){if(supabaseClient)return supabaseClient;if(!window.supabase){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});return supabaseClient}async function loadVisitorCount(){try{const sb=await getSupabase(),{data,error}=await sb.rpc('increment_site_visitors');if(error)throw error;document.getElementById('siteStats').textContent='v0.1.2 · Visitors: '+Number(data).toLocaleString()}catch(e){console.error('Visitor counter:',e);document.getElementById('siteStats').textContent='v0.1.2 · Visitors: —'}}async function getRatings(gameId){const sb=await getSupabase();const{data,error}=await sb.from('ratings').select('rating').eq('game_id',String(gameId));if(error)throw error;return data||[]}async function hasVoted(gameId){const sb=await getSupabase();const{data,error}=await sb.from('ratings').select('id').eq('game_id',String(gameId)).eq('voter_id',voterId()).maybeSingle();if(error)throw error;return!!data}async function showRating(game){try{const rows=await getRatings(game.id||game.title),count=rows.length,avg=count?rows.reduce((a,r)=>a+Number(r.rating),0)/count:0;document.getElementById('detailRating').textContent=count?'⭐ '+avg.toFixed(1)+'/10 · '+count+' rating'+(count===1?'':'s'):'⭐ Not rated yet'}catch(e){console.error(e);document.getElementById('detailRating').textContent='⭐ Not rated yet'}}async function loadGames(){try{const r=await fetch('./games.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('games.json HTTP '+r.status);const d=await r.json();games=Array.isArray(d)?d:(d.games||d.active||[]);populateGenres();render()}catch(e){console.error(e);emptyEl.hidden=false;emptyEl.textContent='Could not load the game catalog.'}}function populateGenres(){const gs=[...new Set(games.flatMap(g=>Array.isArray(g.genres)?g.genres:[]))].sort();genreEl.innerHTML='<option value="">All genres</option>'+gs.map(g=>'<option>'+escapeHtml(g)+'</option>').join('')}function render(list=filteredGames()){document.getElementById('sectionTitle').textContent=removedMode?'Removed Games':'Current Game Pass Games';gamesEl.innerHTML=list.map(g=>'<article class="card" data-id="'+escapeHtml(g.id||g.title)+'"><img class="cover" src="'+escapeHtml(coverUrl(g.cover))+'" alt="'+escapeHtml(g.title)+' cover"><div class="card-info"><h2>'+escapeHtml(g.title)+'</h2><div class="muted">'+escapeHtml((g.genres||[]).join(' · '))+'</div>'+(g.leavingSoon?'<span class="badge">Leaving soon</span>':'')+(g.status==='removed'?'<span class="badge">Removed</span>':'')+'</div></article>').join('');emptyEl.hidden=list.length!==0;gamesEl.querySelectorAll('.card').forEach(c=>c.onclick=()=>openGame(c.dataset.id))}function filteredGames(){const q=searchEl.value.toLowerCase().trim();return games.filter(g=>{const s=g.status||'active';if(removedMode&&s!=='removed')return false;if(!removedMode&&statusEl.value==='removed'&&s!=='removed')return false;return(!q||String(g.title||'').toLowerCase().includes(q))&&(!genreEl.value||(g.genres||[]).includes(genreEl.value))&&(!removedMode&&(!statusEl.value||(statusEl.value==='leaving'?g.leavingSoon:s===statusEl.value))||removedMode)})}function goHome(){removedMode=false;statusEl.value='active';searchEl.value='';render()}function goRemoved(){removedMode=true;statusEl.value='removed';searchEl.value='';render()}async function openGame(id){currentGame=games.find(g=>String(g.id||g.title)===String(id));if(!currentGame)return;document.getElementById('detailTitle').textContent=currentGame.title;const c=document.getElementById('detailCover');c.src=coverUrl(currentGame.cover);c.alt=currentGame.title+' cover';document.getElementById('detailDescription').textContent=currentGame.description||'No description available yet.';document.getElementById('detailGenres').innerHTML=(currentGame.genres||[]).map(g=>'<span class="chip">'+escapeHtml(g)+'</span>').join('');document.getElementById('detailStatus').textContent=currentGame.status==='removed'?'Removed from Game Pass':currentGame.leavingSoon?'🕐 Leaving soon':'Available on Game Pass';document.getElementById('selectedRating').textContent='Choose a rating from 0–10.';const r=document.getElementById('rating');r.innerHTML=Array.from({length:11},(_,i)=>'<button data-rating="'+i+'">'+i+'</button>').join('');r.querySelectorAll('button').forEach(b=>b.onclick=()=>submitRating(Number(b.dataset.rating)));dialog.showModal();await showRating(currentGame);try{if(await hasVoted(currentGame.id||currentGame.title)){document.getElementById('selectedRating').textContent='✓ You already rated this game.';r.querySelectorAll('button').forEach(b=>b.disabled=true)}}catch(e){console.error(e)}}async function submitRating(value){if(!currentGame)return;const buttons=document.querySelectorAll('#rating button');buttons.forEach(b=>b.disabled=true);const msg=document.getElementById('selectedRating');msg.textContent='Submitting…';try{const sb=await getSupabase(),gameId=String(currentGame.id||currentGame.title),voter=voterId();const{error}=await sb.from('ratings').insert({game_id:gameId,rating:value,voter_id:voter});if(error){if(error.code==='23505')throw new Error('You already rated this game.');throw error}msg.textContent='✓ Rated '+value+'/10';await showRating(currentGame)}catch(e){console.error(e);msg.textContent='Could not submit rating: '+(e.message||'unknown error')}finally{try{if(await hasVoted(currentGame.id||currentGame.title))buttons.forEach(b=>b.disabled=true)}catch(e){}}}function surprise(f){const p=f===''?games:games.filter(g=>Boolean(g.indie)===(f==='true'));if(!p.length)return alert('No games match that choice yet.');surpriseDialog.close();openGame(p[Math.floor(Math.random()*p.length)].id)}searchEl.oninput=()=>render();genreEl.onchange=()=>render();statusEl.onchange=()=>render();document.getElementById('status').onchange=()=>render();document.getElementById('homeNav').onclick=goHome;document.getElementById('removedNav').onclick=goRemoved;document.getElementById('closeGame').onclick=()=>dialog.close();document.getElementById('home').onclick=()=>{dialog.close();goHome()};document.getElementById('closeSurprise').onclick=()=>surpriseDialog.close();document.getElementById('surprise').onclick=()=>surpriseDialog.showModal();document.querySelectorAll('[data-indie]').forEach(b=>b.onclick=()=>surprise(b.dataset.indie));loadGames();loadVisitorCount();</script></body></html>
