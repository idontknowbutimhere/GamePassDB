<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Game DB — discover and rate games across major gaming platforms."><title>Game DB</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#f5f5f5;font-family:system-ui,sans-serif}main{text-align:center;padding:32px}h1{font-size:42px;margin:0 0 10px}p{color:#9da3ad;margin:0 0 28px}.cards{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}.card{display:inline-flex;width:300px;min-height:220px;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:22px;text-decoration:none;color:#fff;background:#191c22;border:1px solid #333943;border-radius:18px;box-shadow:0 12px 35px #0006;transition:transform .15s,background .15s}.card:hover{transform:translateY(-3px);background:#242832}.logo{width:220px;height:95px;object-fit:contain;display:block}.name{font-size:22px;font-weight:700}small{color:#9da3ad;font-size:13px}#auth-area{margin:0 auto 28px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}#google-signin{border:1px solid #4a515d;border-radius:10px;padding:10px 18px;background:#191c22;color:#fff;font:inherit;font-weight:700;cursor:pointer}#google-signin:hover{background:#242832}#auth-status{color:#9da3ad;font-size:13px}</style></head><body><main><h1>Game DB</h1><p>Choose a database</p><div id="auth-area"><button id="google-signin" type="button">Sign in with Google</button><span id="auth-status"></span></div><div class="cards"><a class="card" href="./gamepass/"><img class="logo" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Xbox_Game_Pass_logo_-_colored_version.svg" alt="Xbox Game Pass logo"><div class="name">GamePassDB</div><small>Browse and rate Game Pass games</small></a><a class="card" href="./steam/index.html"><img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" alt="Steam logo"><div class="name">SteamDB</div><small>Open Steam database</small></a><a class="card" href="./nintendo/"><img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/0/0d/Nintendo.svg" alt="Nintendo logo"><div class="name">NintendoDB</div><small>Browse and rate Nintendo eShop games</small></a><a class="card" href="./playstation/"><img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/0/00/PlayStation_logo.svg" alt="PlayStation logo"><div class="name">PlayStationDB</div><small>Browse and rate PlayStation Store games</small></a><a class="card" href="./xbox/"><img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/f/f9/Xbox_one_logo.svg" alt="Xbox logo"><div class="name">XboxDB</div><small>Browse and rate Xbox digital-store games</small></a></div></main><script src="./auth.js"></script><script src="./theme.js"></script></body></html>
