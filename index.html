<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GamePassDB</title><style>body{margin:0;background:#0f1115;color:#f5f5f5;font-family:system-ui,sans-serif}button{background:#191c22;color:#fff;border:1px solid #333943;border-radius:10px;padding:10px 13px;cursor:pointer}dialog{background:#191c22;color:#fff;border:1px solid #333943;border-radius:16px}.details{padding:22px}.rating{display:flex;flex-wrap:wrap;gap:6px}</style></head><body><h1>GamePassDB</h1><p id="status">Loading…</p><dialog id="game"><div class="details"><button onclick="game.close()">✕</button><h2 id="title"></h2><p id="dr"></p><h3>Rate this game</h3><div id="rating" class="rating"></div><p id="rm">Choose 0–10.</p></div></dialog><script>const SUPABASE_URL='https://lbuzooszxkygrvyvhpzm.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_kWJWGldsvTjjxKwZaBcq9A_FkZ4M_H9';let client=null,cur={id:'test-game',title:'Test Game'};const $=id=>document.getElementById(id);async function sb(){if(client)return client;if(!window.supabase){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});return client}async function rate(v){const msg=$('rm');msg.textContent='Submitting…';try{const api=await sb();const{error}=await api.from('ratings').insert({game_id:String(cur.id),rating:v});if(error)throw error;msg.textContent='✓ Rated '+v+'/10'}catch(e){console.error('Rating submission failed:',e);msg.textContent='Could not submit rating: '+(e?.message||e?.details||e?.hint||'Supabase rejected the request')}}function openTest(){$('title').textContent=cur.title;$('rating').innerHTML=Array.from({length:11},(_,i)=>'<button onclick="rate('+i+')">'+i+'</button>').join('');game.showModal()}openTest();$('status').textContent='Rating client loaded';</script></body></html>
